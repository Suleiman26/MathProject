<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Rubik", sans-serif;
    background:
      radial-gradient(900px 500px at 85% 10%, #e0e7ff 0%, transparent 60%),
      radial-gradient(700px 500px at 5% 100%, #ccfbf1 0%, transparent 60%),
      #f8f8f5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 0 96px;
    color: #111827;
  }
  .logo { width: 250px; height: 250px; border-radius: 56px; box-shadow: 0 30px 60px -20px rgb(49 46 129 / .45), 0 2px 6px rgb(0 0 0 / .08); flex: none; }
  .text { margin-top: 34px; }
  h1 { font-size: 72px; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; }
  p { margin-top: 14px; font-size: 34px; font-weight: 500; color: #4b5563; line-height: 1.3; }
  .chips { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chips span { font-size: 26px; font-weight: 500; padding: 8px 20px; border-radius: 999px; background: #fff; border: 1px solid #e5e7eb; color: #374151; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="">
  <div class="text">
    <h1>מתמטיקה חט״ב</h1>
    <p>תרגול מתמטיקה לחטיבת הביניים, שלב אחר שלב.</p>
  </div>
</body>
</html>
