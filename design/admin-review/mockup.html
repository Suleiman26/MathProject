<title>בקרת תוכן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root{
  --bg:#f5f5f2; --surface:#ffffff; --surface-2:#fafaf8; --surface-3:#f2f1ee; --hover:#efeee9;
  --line:#e7e5e0; --line-strong:#d6d3cc; --ink:#1c1b19; --ink-2:#4f4d48; --ink-3:#8a877f; --on-solid:#ffffff;
  --coral-50:#fff4ef; --coral-100:#ffe4d9; --coral-200:#ffc8b4; --coral-500:#f2643f; --coral-600:#e0502b; --coral-700:#b5401f;
  --ok-50:#f0fdf4; --ok-200:#bbf7d0; --ok-600:#16a34a; --ok-700:#15803d;
  --chg-50:#f5f3ff; --chg-200:#ddd6fe; --chg-600:#7c3aed; --chg-700:#6d28d9;
  --new-50:#eff6ff; --new-600:#2563eb; --new-700:#1d4ed8;
  --wk-50:#fffbeb; --wk-600:#d97706; --wk-800:#92400e;
  --ro-50:#fef2f2; --ro-600:#dc2626; --ro-700:#b91c1c;
  --lt-600:#a8a29e;
  --sh-1:0 1px 2px rgb(28 27 25 / .05);
  --sh-2:0 1px 2px rgb(28 27 25 / .04), 0 8px 24px -12px rgb(28 27 25 / .16);
  --sh-3:0 2px 6px rgb(28 27 25 / .06), 0 24px 60px -20px rgb(28 27 25 / .30);
  --scrim:rgb(20 19 17 / .40);
  --ring:0 0 0 3px rgb(242 100 63 / .28);
  --toast-bg:#1c1b19; --toast-ink:#ffffff;
  /* the preview is a picture of the real (light) student site */
  --pv-bg:#f5f5f2; --pv-surface:#ffffff; --pv-line:#e7e5e0; --pv-ink:#1c1b19; --pv-ink-2:#4f4d48; --pv-ink-3:#8a877f;
  --pv-ok:#16a34a; --pv-ok-50:#f0fdf4; --pv-bad:#dc2626; --pv-bad-50:#fef2f2; --pv-on:#ffffff; --frame:#1f1e1c; --frame-hi:#3a3935;
  --tc-teal-50:#f0fdfa; --tc-teal-200:#99f6e4; --tc-teal-500:#14b8a6; --tc-teal-600:#0d9488; --tc-teal-800:#115e59;
  --tc-sky-50:#f0f9ff; --tc-sky-200:#bae6fd; --tc-sky-500:#0ea5e9; --tc-sky-600:#0284c7; --tc-sky-800:#075985;
  --tc-blue-50:#eff6ff; --tc-blue-200:#bfdbfe; --tc-blue-500:#3b82f6; --tc-blue-600:#2563eb; --tc-blue-800:#1e40af;
  --tc-indigo-50:#eef2ff; --tc-indigo-200:#c7d2fe; --tc-indigo-500:#6366f1; --tc-indigo-600:#4f46e5; --tc-indigo-800:#3730a3;
  --tc-violet-50:#f5f3ff; --tc-violet-200:#ddd6fe; --tc-violet-500:#8b5cf6; --tc-violet-600:#7c3aed; --tc-violet-800:#5b21b6;
  --tc-pink-50:#fdf2f8; --tc-pink-200:#fbcfe8; --tc-pink-500:#ec4899; --tc-pink-600:#db2777; --tc-pink-800:#9d174d;
  --tc-cyan-50:#ecfeff; --tc-cyan-200:#a5f3fc; --tc-cyan-500:#06b6d4; --tc-cyan-600:#0891b2; --tc-cyan-800:#155e75;
  --tc-orange-50:#fff7ed; --tc-orange-200:#fed7aa; --tc-orange-500:#f97316; --tc-orange-600:#ea580c; --tc-orange-800:#9a3412;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131312; --surface:#1c1b19; --surface-2:#211f1d; --surface-3:#292825; --hover:#2e2d2a;
    --line:#33312d; --line-strong:#47443f; --ink:#f2f0eb; --ink-2:#c6c2b9; --ink-3:#8f8b82; --on-solid:#ffffff;
    --coral-50:#341c14; --coral-100:#46251a; --coral-200:#6a3423; --coral-500:#ff7a56; --coral-600:#ea5a33; --coral-700:#ffab90;
    --ok-50:#10291a; --ok-200:#1f5233; --ok-600:#34c26a; --ok-700:#6ee79a;
    --chg-50:#231a3d; --chg-200:#3f2f72; --chg-600:#a184ff; --chg-700:#c4b2ff;
    --new-50:#14213d; --new-600:#5b8cff; --new-700:#9bbcff;
    --wk-50:#2e2210; --wk-600:#f0a43a; --wk-800:#f7c97c;
    --ro-50:#351616; --ro-600:#f26464; --ro-700:#ff9e9e;
    --lt-600:#7d7974;
    --sh-1:0 1px 2px rgb(0 0 0 / .4);
    --sh-2:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px -12px rgb(0 0 0 / .6);
    --sh-3:0 2px 6px rgb(0 0 0 / .5), 0 24px 60px -20px rgb(0 0 0 / .8);
    --scrim:rgb(0 0 0 / .6); --ring:0 0 0 3px rgb(255 122 86 / .35);
    --toast-bg:#f2f0eb; --toast-ink:#1c1b19;
    --pv-bg:#e9e8e4; --frame:#0b0b0a; --frame-hi:#2c2b28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1c1b19; --surface-2:#211f1d; --surface-3:#292825; --hover:#2e2d2a;
  --line:#33312d; --line-strong:#47443f; --ink:#f2f0eb; --ink-2:#c6c2b9; --ink-3:#8f8b82; --on-solid:#ffffff;
  --coral-50:#341c14; --coral-100:#46251a; --coral-200:#6a3423; --coral-500:#ff7a56; --coral-600:#ea5a33; --coral-700:#ffab90;
  --ok-50:#10291a; --ok-200:#1f5233; --ok-600:#34c26a; --ok-700:#6ee79a;
  --chg-50:#231a3d; --chg-200:#3f2f72; --chg-600:#a184ff; --chg-700:#c4b2ff;
  --new-50:#14213d; --new-600:#5b8cff; --new-700:#9bbcff;
  --wk-50:#2e2210; --wk-600:#f0a43a; --wk-800:#f7c97c;
  --ro-50:#351616; --ro-600:#f26464; --ro-700:#ff9e9e;
  --lt-600:#7d7974;
  --sh-1:0 1px 2px rgb(0 0 0 / .4);
  --sh-2:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px -12px rgb(0 0 0 / .6);
  --sh-3:0 2px 6px rgb(0 0 0 / .5), 0 24px 60px -20px rgb(0 0 0 / .8);
  --scrim:rgb(0 0 0 / .6); --ring:0 0 0 3px rgb(255 122 86 / .35);
  --toast-bg:#f2f0eb; --toast-ink:#1c1b19;
  --pv-bg:#e9e8e4; --frame:#0b0b0a; --frame-hi:#2c2b28;
  color-scheme:dark;
}

/* ── Base ───────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ltr{direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1 1 auto}
:focus-visible{outline:2px solid var(--coral-500);outline-offset:2px}

.cpl{min-height:100vh;min-height:100dvh;padding-block:12px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));font-size:14px;line-height:1.45}

/* buttons */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap;transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 150ms,border-color 150ms,box-shadow 150ms}
.b:active{transform:scale(.97)}
.b .ic{width:17px;height:17px}
.b.pri{background:var(--coral-600);border-color:var(--coral-600);color:var(--on-solid);box-shadow:0 1px 2px rgb(0 0 0 / .1),0 6px 16px -8px var(--coral-600)}
.b.ok{background:var(--ok-600);border-color:var(--ok-600);color:var(--on-solid)}
.b.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.b.soft{background:var(--surface-3);border-color:transparent}
.b.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.b:disabled{opacity:.45;cursor:default;transform:none}
@media (hover:hover) and (pointer:fine){
  .b:not(.pri):not(.ok):not(:disabled):hover{background:var(--hover)}
  .b.pri:not(:disabled):hover{background:var(--coral-500)}
}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-2)}
@media (hover:hover) and (pointer:fine){.ib:hover{background:var(--hover);color:var(--ink)}}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;border:1px solid var(--line-strong);border-bottom-width:2px;background:var(--surface);font-size:11px;font-weight:600;color:var(--ink-2);font-family:ui-monospace,Menlo,monospace}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.chip[aria-pressed="true"] .n{background:rgb(255 255 255 / .2);color:inherit}

/* marks: ○ not checked · ✓ checked · ● open requests · ↻ changed / fixed, check again */
.mk{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%}
.mk .ic{width:12px;height:12px;stroke-width:2.6}
.mk.none{border:1.6px solid var(--line-strong)}
.mk.ok{background:var(--ok-600);color:var(--on-solid)}
.mk.chg{background:var(--chg-50);color:var(--chg-600);box-shadow:inset 0 0 0 1.4px var(--chg-200)}
.mk.open{width:auto;min-width:18px;padding:0 5px;border-radius:999px;background:var(--coral-600);color:var(--on-solid);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}

/* status pills (same six as the fixes board) */
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--stb);color:var(--stc)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--st)}
.s-new{--st:var(--new-600);--stb:var(--new-50);--stc:var(--new-700)}
.s-working{--st:var(--wk-600);--stb:var(--wk-50);--stc:var(--wk-800)}
.s-review{--st:var(--chg-600);--stb:var(--chg-50);--stc:var(--chg-700)}
.s-reopened{--st:var(--ro-600);--stb:var(--ro-50);--stc:var(--ro-700)}
.s-done{--st:var(--ok-600);--stb:var(--ok-50);--stc:var(--ok-700)}
.s-later{--st:var(--lt-600);--stb:var(--surface-3);--stc:var(--ink-3)}

/* ── Rail (admin side nav, folded on this page) ─────────────────────── */
.rail{display:none}
/* ── Top bar ────────────────────────────────────────────────────────── */
.top{display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;gap:10px;min-width:0}
.ttl{min-width:0}
.ttl h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.ttl p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.tabs{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--surface-3)}
.tabs a{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.tabs a .n{font-size:11px;font-weight:700;color:var(--coral-700)}
.srch{position:relative;display:block;min-width:0}
.srch input{width:100%;height:38px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);padding:0 36px 0 40px;font-size:13.5px;outline:none}
.srch input:focus{border-color:var(--coral-500);box-shadow:var(--ring)}
.srch .ic{position:absolute;inset-inline-start:11px;top:10px;color:var(--ink-3)}
.srch .kbd{position:absolute;inset-inline-end:9px;top:9px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.tree-h{padding-top:12px}
.tctl{display:grid;gap:10px}
.prog{display:flex;align-items:flex-end;gap:10px;min-width:0;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.prog-t{flex:1 1 auto;min-width:0;display:grid;gap:7px;font-size:12.5px;color:var(--ink-2)}
.prog-t b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{position:relative;display:flex;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok-600);transition:width 400ms cubic-bezier(.23,1,.32,1)}
.bar i.c{background:var(--chg-600);opacity:.75}
.who{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.who i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--coral-100);color:var(--coral-700);font-style:normal;font-weight:700;font-size:12px}

/* ── Tree ───────────────────────────────────────────────────────────── */
.tree{min-width:0}
.tree-h{display:flex;align-items:center;gap:8px;padding:6px 4px 8px;color:var(--ink-3);font-size:12px;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:12px 6px 4px;color:var(--ink-3);font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .mk{width:14px;height:14px}
.legend .mk .ic{width:9px;height:9px}
.legend .mk.open{min-width:14px;font-size:9px;padding:0 3px}
.tr{position:relative;display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 8px;border-radius:9px;color:var(--ink-2);cursor:pointer;user-select:none;-webkit-user-select:none;transition:background-color 120ms}
@media (hover:hover) and (pointer:fine){.tr:hover{background:var(--hover)}}
.tr[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1),inset 0 0 0 1px var(--line)}
.tr[aria-selected="true"]::before{content:"";position:absolute;inset-block:7px;inset-inline-start:-1px;width:3px;border-radius:3px;background:var(--coral-600)}
.tr.l1{font-weight:700;color:var(--ink);font-size:14px;margin-top:6px}
.tr.l2{padding-inline-start:12px;font-weight:500}
.tr.l3{padding-inline-start:34px}
.tr.l4{padding-inline-start:58px;font-size:13px;min-height:30px}
.tr.l4::after{content:"";position:absolute;inset-inline-start:44px;top:0;bottom:0;width:1px;background:var(--line)}
.car{display:inline-grid;place-items:center;width:18px;height:18px;margin-inline-start:-4px;border-radius:5px;color:var(--ink-3);flex:none}
.car .ic{width:14px;height:14px;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.car.o .ic{transform:rotate(-90deg)}
.car.x{visibility:hidden}
.tdot{width:8px;height:8px;border-radius:3px;flex:none;background:var(--tdot)}
.tr-n{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-n mark{background:var(--coral-100);color:inherit;border-radius:3px;padding:0 1px}
.tr-c{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums}
.mini{display:inline-block;width:38px;height:4px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.mini i{display:block;height:100%;background:var(--ok-600)}
.rv{display:inline-flex;align-items:center;gap:2px;color:var(--chg-600);font-weight:600}
.rv .ic{width:12px;height:12px;stroke-width:2.4}
.tree-empty{padding:28px 10px;text-align:center;color:var(--ink-3)}

/* ── Preview stage ──────────────────────────────────────────────────── */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.pvbar{display:grid;gap:8px;padding:0 2px 10px}
.pvr{display:flex;align-items:center;gap:8px;min-width:0}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 200px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;font-size:13px;color:var(--ink-3)}
.crumbs::-webkit-scrollbar{display:none}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs .sep{opacity:.5}
.qn{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;background:var(--surface-3);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--surface-3)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.seg .ic{width:16px;height:16px}
.canvas{position:relative;flex:1 1 auto;min-height:0;border-radius:20px;background:
  radial-gradient(900px 420px at 50% -10%, var(--surface-2), transparent 70%), var(--surface-3);
  display:flex;align-items:flex-start;justify-content:center;overflow:hidden;padding:14px}
.iso{flex:none;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:11.5px;font-weight:500;box-shadow:var(--sh-1)}
.iso i{width:7px;height:7px;border-radius:50%;background:var(--ok-600)}
.pickbar{position:absolute;inset-block-end:14px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--toast-bg);color:var(--toast-ink);font-size:13px;box-shadow:var(--sh-3);white-space:nowrap}
.pickbar .b{height:28px;background:transparent;border-color:rgb(127 127 127 / .4);color:inherit}
.phone{position:relative;width:375px;max-width:100%;height:100%;max-height:812px;border-radius:44px;background:var(--frame);padding:11px;box-shadow:var(--sh-3),inset 0 0 0 1.5px var(--frame-hi)}
.phone .scr{height:100%;border-radius:34px;overflow:hidden auto;background:var(--pv-bg);scrollbar-width:none}
.phone .scr::-webkit-scrollbar{display:none}
.phone .notch{position:absolute;top:19px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:20px;background:var(--frame);z-index:2}
.desk{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;background:var(--pv-bg);box-shadow:var(--sh-3);display:flex;flex-direction:column}
.desk .chrome{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.desk .chrome i{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.desk .chrome span{flex:1;margin-inline:10px;height:18px;border-radius:6px;background:var(--surface-3);font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;padding:0 8px;direction:ltr;overflow:hidden;white-space:nowrap}
.desk .vp{flex:1;min-height:0;overflow:hidden;position:relative}
.desk .vp > .pvwrap{position:absolute;top:0;right:0;width:1180px;transform-origin:top right;overflow:hidden auto;scrollbar-width:none}

/* ── The fake topic page (simplified copy of the student site) ──────── */
.pv{--pa-50:var(--tc-teal-50);--pa-200:var(--tc-teal-200);--pa-500:var(--tc-teal-500);--pa-600:var(--tc-teal-600);--pa-800:var(--tc-teal-800);
  min-height:100%;background:radial-gradient(700px 240px at 50% -80px, var(--pa-50), transparent 75%) no-repeat, var(--pv-bg);color:var(--pv-ink);font-size:15px;padding-bottom:110px}
.pv[data-tc="sky"]{--pa-50:var(--tc-sky-50);--pa-200:var(--tc-sky-200);--pa-500:var(--tc-sky-500);--pa-600:var(--tc-sky-600);--pa-800:var(--tc-sky-800)}
.pv[data-tc="blue"]{--pa-50:var(--tc-blue-50);--pa-200:var(--tc-blue-200);--pa-500:var(--tc-blue-500);--pa-600:var(--tc-blue-600);--pa-800:var(--tc-blue-800)}
.pv[data-tc="indigo"]{--pa-50:var(--tc-indigo-50);--pa-200:var(--tc-indigo-200);--pa-500:var(--tc-indigo-500);--pa-600:var(--tc-indigo-600);--pa-800:var(--tc-indigo-800)}
.pv[data-tc="violet"]{--pa-50:var(--tc-violet-50);--pa-200:var(--tc-violet-200);--pa-500:var(--tc-violet-500);--pa-600:var(--tc-violet-600);--pa-800:var(--tc-violet-800)}
.pv[data-tc="pink"]{--pa-50:var(--tc-pink-50);--pa-200:var(--tc-pink-200);--pa-500:var(--tc-pink-500);--pa-600:var(--tc-pink-600);--pa-800:var(--tc-pink-800)}
.pv[data-tc="cyan"]{--pa-50:var(--tc-cyan-50);--pa-200:var(--tc-cyan-200);--pa-500:var(--tc-cyan-500);--pa-600:var(--tc-cyan-600);--pa-800:var(--tc-cyan-800)}
.pv[data-tc="orange"]{--pa-50:var(--tc-orange-50);--pa-200:var(--tc-orange-200);--pa-500:var(--tc-orange-500);--pa-600:var(--tc-orange-600);--pa-800:var(--tc-orange-800)}
.pv-top{display:flex;align-items:center;gap:8px;padding:46px 14px 8px}
.pv-top b{flex:1;font-size:17px;font-weight:700;text-align:center}
.pv-top .pv-i{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--pv-surface);border:1px solid var(--pv-line);color:var(--pv-ink-2)}
.pv-chs,.pv-subs{display:flex;gap:6px;overflow-x:auto;padding:6px 14px;scrollbar-width:none}
.pv-chs::-webkit-scrollbar,.pv-subs::-webkit-scrollbar{display:none}
.pv-ch{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--pv-line);background:var(--pv-surface);color:var(--pv-ink-2);font-size:13.5px;font-weight:500;white-space:nowrap}
.pv-ch.on{background:var(--pa-600);border-color:var(--pa-600);color:var(--pv-on);font-weight:600}
.pv-sb{flex:none;height:30px;padding:0 12px;border-radius:10px;border:1px solid var(--pv-line);background:transparent;color:var(--pv-ink-2);font-size:12.5px;white-space:nowrap}
.pv-sb.on{background:var(--pa-50);border-color:var(--pa-200);color:var(--pa-800);font-weight:600}
.pv-card{margin:10px 14px 0;padding:16px;border-radius:20px;background:var(--pv-surface);border:1px solid var(--pv-line);box-shadow:0 1px 2px rgb(28 27 25 / .04),0 8px 24px -12px rgb(28 27 25 / .14)}
.pv-ct{font-size:17px;font-weight:700}
.pv-ask{margin:6px 0 0;color:var(--pv-ink-2);font-size:14px}
.pv-eq{margin:12px 0;padding:18px 10px;border-radius:16px;background:var(--pa-50);text-align:center;font-size:29px;font-weight:700;direction:ltr;letter-spacing:.01em}
.pv-eq.rtl{direction:rtl;font-size:24px}
.pv-eq sup{font-size:.6em}
.rt{display:inline-flex;align-items:flex-start}
.rt span{border-top:2.5px solid currentColor;padding:0 3px;margin-top:4px;line-height:1.05}
.pv-draw{display:flex;justify-content:center;margin:4px 0 12px}
.pv-draw svg{width:100%;max-width:300px;height:auto;direction:ltr}
.dr-l{stroke:var(--pv-ink);stroke-width:2.5;fill:none;stroke-linejoin:round}
.dr-f{fill:var(--pa-50)}
.dr-a{stroke:var(--pa-600);stroke-width:3;fill:none;stroke-linecap:round}
.dr-g{stroke:var(--pv-line);stroke-width:1}
.dr-x{stroke:var(--pv-ink-3);stroke-width:1.4}
.dr-t{fill:var(--pv-ink);font:600 15px Rubik,system-ui,sans-serif}
.dr-tx{fill:var(--pa-800);font:700 17px Rubik,system-ui,sans-serif}
.pv-step{margin-top:12px;padding:12px;border-radius:16px;background:var(--pv-surface);border:1px solid var(--pv-line);border-inline-start:3px solid var(--pa-500)}
.pv-step.done{background:var(--pv-ok-50);border-inline-start-color:var(--pv-ok)}
.pv-sl{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--pa-50);color:var(--pa-800);font-size:13px;font-weight:700}
.pv-ans{display:flex;align-items:center;gap:8px;margin-top:10px}
.pv-ans input{width:110px;height:50px;border-radius:14px;border:1.5px solid var(--pv-line);background:var(--pv-surface);color:var(--pv-ink);text-align:center;font-size:20px;font-weight:600;direction:ltr;outline:none}
.pv-ans input:focus{border-color:var(--pa-500)}
.pv-chk{height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--pa-600);color:var(--pv-on);font-size:15px;font-weight:600}
.pv-fb{margin-top:8px;font-size:14px;font-weight:600;min-height:20px}
.pv-fb.ok{color:var(--pv-ok)} .pv-fb.err{color:var(--pv-bad)}
.pv-new{margin-top:14px;height:42px;padding:0 16px;border-radius:12px;border:1.5px solid var(--pa-600);background:transparent;color:var(--pa-800);font-weight:600;font-size:14px}
.pv-list{margin:10px 14px 0;display:grid;gap:8px}
.pv-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--pv-surface);border:1px solid var(--pv-line);text-align:start;width:100%}
.pv-row b{display:block;font-size:15px}
.pv-row small{color:var(--pv-ink-3);font-size:12.5px}
.pv-row .tdot{width:10px;height:28px;border-radius:5px}
.pv-h{margin:10px 18px 0;font-size:22px;font-weight:700}
/* desktop look of the same page */
.pv.dk{font-size:16px}
.pv.dk .pv-top{padding:22px 40px 10px}
.pv.dk .pv-top b{font-size:22px}
.pv.dk .pv-chs,.pv.dk .pv-subs{justify-content:center;flex-wrap:wrap;padding-inline:40px}
.pv.dk .pv-card,.pv.dk .pv-list{max-width:760px;margin-inline:auto}
.pv.dk .pv-h{max-width:760px;margin-inline:auto}
/* picking a part (report mode) */
.picking [data-pick]{cursor:crosshair}
@media (hover:hover){.picking [data-pick]:hover{outline:2px dashed var(--coral-500);outline-offset:3px;border-radius:12px}}
.picking .pv-ans input{pointer-events:none}
[data-pick].picked{outline:2.5px solid var(--coral-600);outline-offset:3px;border-radius:12px}

/* ── Inspector ──────────────────────────────────────────────────────── */
.insp{min-width:0;min-height:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-1)}
.ins{padding:16px}
.eyebrow{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.01em}
.ins h2{margin:3px 0 0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.ins-path{margin-top:3px;font-size:12.5px;color:var(--ink-3)}
.ckline{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 11px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.ckline.ok{background:var(--ok-50);border-color:var(--ok-200);color:var(--ok-700)}
.ckline.chg{background:var(--chg-50);border-color:var(--chg-200);color:var(--chg-700)}
.ckline small{display:block;color:var(--ink-3);font-size:11.5px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .b{flex:1 1 auto}
.note{margin-top:10px;font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:flex-start}
.sec{padding:14px 16px;border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-h h3{margin:0;font-size:13.5px;font-weight:700}
.sec-h .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface-3);font-size:11px;font-weight:700;display:inline-grid;place-items:center;color:var(--ink-2)}
.sec-h .sub{font-size:12px;color:var(--ink-3)}
.list{display:grid;gap:8px}
.it{position:relative;padding:11px 12px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:border-color 150ms,box-shadow 150ms}
.it::before{content:"";position:absolute;inset-block:12px;inset-inline-start:-1px;width:3px;border-radius:3px;background:var(--st)}
@media (hover:hover) and (pointer:fine){.it:hover{border-color:var(--line-strong)}}
.it.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--coral-200)}100%{box-shadow:0 0 0 0 transparent}}
.it-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.it-id{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.it-w{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-3);padding:2px 7px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-r{font-size:11.5px;color:var(--ink-3)}
.it-b{margin:7px 0 4px;font-size:13.5px;line-height:1.6;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.it.op .it-b{display:block;-webkit-line-clamp:unset}
.it.s-done .it-b{color:var(--ink-3)}
.it-m{font-size:11.5px;color:var(--ink-3)}
.snap,.map code,.it-b,.thr p{unicode-bidi:plaintext}
.snap{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--line-strong);font-size:12.5px;line-height:1.55;color:var(--ink-2);white-space:pre-line}
.snap b{display:block;font-size:11px;color:var(--ink-3);font-weight:600;margin-bottom:2px}
.thr{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);display:grid;gap:9px}
.thr li{padding-inline-start:10px;border-inline-start:2px solid var(--line)}
.thr li.bot{border-color:var(--chg-200)}
.thr .h{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.thr .h b{color:var(--ink)}
.thr p{margin:2px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.it-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reply{margin-top:10px;display:grid;gap:8px}
.ta{width:100%;min-height:76px;resize:vertical;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);padding:10px 12px;font-size:14px;line-height:1.55;outline:none}
.ta:focus{border-color:var(--coral-500);box-shadow:var(--ring)}
.above{overflow:hidden;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2);cursor:pointer;border:1px solid transparent;width:100%;text-align:start}
@media (hover:hover) and (pointer:fine){.above:hover{border-color:var(--line)}}
.above .it-w{flex:none}
.above span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:16px 12px;border-radius:14px;background:var(--surface-2);text-align:center;color:var(--ink-3);font-size:13px;line-height:1.55}
.empty b{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:2px}
.foot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.foot a{white-space:nowrap;color:var(--coral-700);font-weight:600;text-decoration:none}

/* ── Report form (desktop: over the inspector; phone: bottom sheet) ── */
.rep{display:none}
.rep.on{display:flex;flex-direction:column}
.rep-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.rep-h h2{margin:0;font-size:17px;font-weight:700;flex:1}
.rep-b{padding:0 16px 14px;overflow:auto;flex:1 1 auto;min-height:0}
.lbl{display:block;margin:14px 0 7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.lbl:first-child{margin-top:2px}
.path{display:flex;flex-wrap:wrap;gap:6px}
.pc{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;max-width:100%}
.pc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc[aria-pressed="true"]{background:var(--coral-600);border-color:var(--coral-600);color:var(--on-solid);font-weight:600}
.pc.dim{opacity:.4;border-style:dashed}
.pc small{font-size:10.5px;opacity:.75;font-weight:500}
.lvl-d{margin-top:7px;font-size:12.5px;color:var(--ink-3)}
.part{display:inline-flex;align-items:center;gap:6px;margin-top:8px;height:28px;padding:0 6px 0 10px;border-radius:8px;background:var(--coral-50);color:var(--coral-700);font-size:12.5px;font-weight:600}
.part button{border:0;background:transparent;color:inherit;display:grid;place-items:center;width:20px;height:20px;padding:0}
.part .ic{width:13px;height:13px}
/* scope: plain-word choices instead of breadcrumb chips */
.scope{display:grid;gap:6px}
.sc{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:8px 12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);text-align:start}
.sc b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc small{display:block;font-size:12px;color:var(--ink-3);line-height:1.4}
.sc > span:last-child{min-width:0;flex:1 1 auto}
.sc-dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.6px solid var(--line-strong)}
.sc[aria-checked="true"]{border-color:var(--coral-500);background:var(--coral-50)}
.sc[aria-checked="true"] .sc-dot{border:5px solid var(--coral-600)}
.more-lvl{justify-self:start}
.hint{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--coral-50);color:var(--coral-700);font-size:12.5px;line-height:1.5}
.hint span{flex:1 1 auto;min-width:0}
.hint button{flex:none;border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;padding:4px}
.above-d summary{cursor:pointer;font-size:12.5px;color:var(--ink-3);list-style:none;padding:2px 0}
.above-d summary::-webkit-details-marker{display:none}
.above-d[open] .list{margin-top:8px}
.sheet-x{display:none}
.toast .tb{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;padding:4px 2px;white-space:nowrap}
.rsn{display:flex;flex-wrap:wrap;gap:6px}
.rsn .chip[aria-pressed="true"]{background:var(--coral-50);border-color:var(--coral-500);color:var(--coral-700);font-weight:600}
.dup{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--wk-50);color:var(--wk-800);font-size:12.5px;line-height:1.5}
.dup b{display:block}
.dup button{margin-top:6px}
.attach{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.file{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;background:var(--surface-3);font-size:12.5px;color:var(--ink-2)}
details.how{margin-top:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
details.how summary{cursor:pointer;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"+ ";color:var(--ink-3)}
details.how[open] summary::before{content:"− "}
.map{padding:0 12px 12px;display:grid;gap:6px;font-size:12px}
.map div{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}
.map code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 6px;white-space:pre-wrap;word-break:break-word;color:var(--ink);line-height:1.5}
.map span{color:var(--ink-3);padding-top:4px}
.rep-f{display:flex;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 20px 20px}
.rep-f .b.pri{flex:1}
.rep-f .by{font-size:12px;color:var(--ink-3)}
.rep-f .by button{border:0;background:none;color:var(--ink-2);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:2px}

/* ── Phone parts ────────────────────────────────────────────────────── */
.stepbar,.fabs,.pvh{display:none}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity 200ms}
.scrim.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);z-index:80;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:var(--toast-bg);color:var(--toast-ink);font-size:13.5px;font-weight:500;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:opacity 200ms,transform 260ms cubic-bezier(.23,1,.32,1)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ic{color:var(--ok-600)}
.help{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:16px}
.help.on{display:grid}
.help .panel{position:relative;width:100%;max-width:440px;padding:18px 18px 12px;box-shadow:var(--sh-3)}
.help h2{margin:0 0 4px;font-size:17px}
.help p{margin:0 0 10px;color:var(--ink-3);font-size:12.5px}
.help table{width:100%;border-collapse:collapse;font-size:13px}
.help td{padding:7px 0;border-top:1px solid var(--line)}
.help td:last-child{text-align:end;white-space:nowrap}

/* ── Desktop: four columns (RTL: rail · tree · preview · inspector) ── */
@media (min-width:1100px){
  .cpl{height:100vh;height:100dvh;display:grid;grid-template-columns:56px 296px minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr);gap:12px 14px;overflow:hidden}
  .rail{display:flex;flex-direction:column;align-items:center;gap:4px;grid-column:1;grid-row:1/3;padding:4px 0;border-inline-end:1px solid var(--line);margin-inline-end:-2px}
  .rail img,.rail .logo{width:34px;height:34px;border-radius:10px;margin-bottom:10px;background:linear-gradient(135deg,var(--coral-500),var(--chg-600))}
  .rail a{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;color:var(--ink-3)}
  .rail a[aria-current="page"]{background:var(--coral-50);color:var(--coral-700)}
  .top{grid-column:2/5;grid-row:1}
  .top-row.t1{gap:16px}
  .tree{display:flex;flex-direction:column}
  .tctl{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:6px}
    .tree{grid-column:2;grid-row:2;overflow:auto;padding:0 2px 16px;scrollbar-width:thin}
  .tree .srch{max-width:none}
  .stage{grid-column:3;grid-row:2}
  .insp{grid-column:4;grid-row:2;overflow:auto;scrollbar-width:thin}
  .rep{grid-column:4;grid-row:2;z-index:5;min-height:0}
  .rep.on{box-shadow:var(--sh-3)}
}
@media (min-width:1100px) and (max-width:1320px){
  .cpl{grid-template-columns:56px 260px minmax(0,1fr) 340px}
  .top .ttl p,.tabs{display:none}
}

/* ── Phone and tablet: three steps ─────────────────────────────────── */
@media (max-width:1099px){
  .cpl{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));font-size:15px}
  .cpl[data-step="tree"] .stage,.cpl[data-step="tree"] .insp,
  .cpl[data-step="pv"] .tree,.cpl[data-step="pv"] .insp{display:none}
  .cpl:not([data-step="tree"]) .top{display:none}
  .top-row.t1{justify-content:space-between}
  .tabs,.hk,.ttl p{display:none}
  .srch .kbd{display:none}
  .tctl{margin-top:12px}
  .srch input{height:44px;font-size:16px}
  .srch .ic{top:13px}
  .tr{min-height:46px;padding:6px 10px}
  .tr.l4{min-height:40px}
  .tr-n{white-space:normal}
  .pvh{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .pvh .crumbs{font-size:13px}
  .pvbar{display:none}
  /* the real page runs edge to edge: exactly the width a student's phone has */

/* scope = 2–3 plain-word choices, nearest first; the rest behind "רמה אחרת" */
function scopes(){
  const s = S.sel, L = [];
  const gOk = s.g !== "all" && G[s.g] && !G[s.g].hidden;
  if(s.t){
    L.push({lvl:"question", label:"השאלה שעל המסך", d:"רק השאלה הזאת. נשמרת כמו שהיא, עם מה שהוקלד ומה שהאתר ענה"});
    if(pvS()) L.push({lvl:"sub", label:"כל ״" + pvS() + "״", d:"בעיה שחוזרת בכל השאלות של החלק הזה"});
    L.push({lvl:"chapter", label:"כל הפרק ״" + pvC() + "״", d:"בעיה שחוזרת בכל הפרק"});
    L.push({lvl:"topic", label:"כל הנושא ״" + T[s.t].n + "״", d:"פרק חסר, סדר הפרקים, משהו בכל הנושא", more:true});
  }
  if(gOk) L.push({lvl:"grade", label:"כל " + G[s.g].name, d:"נושא חסר, סדר הנושאים", more:!!s.t});

const stepName = () => (S.ex && S.ex.step ? S.ex.step.split(" — ")[0] : "");
function wherePath(lvl){

  if(lvl === "grade") return p.join(" › ");
  p.push(T[s.t].n); if(lvl === "topic") return p.join(" › ");
  p.push(pvC()); if(lvl === "chapter") return p.join(" › ");

function target(lvl){

/* the frozen question: linear math markers (^ for powers, √( ) for roots, (a)/(b) for fractions), drawings as their labels */

function openRep(lvl){

/* ── Selection + queue ── */
function select(sel, opts={}){
  S.sel = {g:sel.g, t:sel.t || null, c:sel.c || null, s:sel.s || null};
  if(S.sel.g) S.open.add("g|" + S.sel.g);
  if(S.sel.t) S.open.add("t|" + S.sel.g + "|" + S.sel.t);
  if(S.sel.c && subsOf(S.sel.t, S.sel.c).length) S.open.add("c|" + S.sel.g + "|" + S.sel.t + "|" + S.sel.c);
  S.openItem = null; S.itemMode = null; S.pick = false; S.sheet = false;
  if(S.rep) S.rep = null;
  if(isPhone() && opts.go) S.step = "pv";
  render();
  if(opts.scroll !== false) setTimeout(() => { const el = $('#tree [aria-selected="true"]'); if(el && !isPhone()) el.scrollIntoView({block:"nearest"}); }, 0);
}
function queue(){
  const all = [], seen = new Set();
  ["7","8","9"].forEach(g => gradeTopics(g).forEach(t => { if(seen.has(t)) return; seen.add(t); CH[t].forEach(c => all.push({g, t, c})); }));
  const pri = (x) => { const m = chMark(x.t, x.c); if(m.r) return 0; if(items.some(i => i.st === "reopened" && i.t === x.t && i.c === x.c)) return 1; if(m.ck && !m.valid) return 2; if(!m.valid) return 3; return 9; };
  return all.map(x => ({...x, p:pri(x)})).filter(x => x.p < 9).sort((a, b) => a.p - b.p);
}
function nextToCheck(){
  const q = queue(); if(!q.length) return toast("הכל נבדק!");
  /* most urgent group first (fixes to approve, then sent back, changed, never checked); inside a group, the one after where you are */
  const cur = q.find(x => x.t === S.sel.t && x.c === pvC());
  const others = q.filter(x => x !== cur); if(!others.length) return toast("זה האחרון שנשאר");
  const minP = Math.min(...others.map(x => x.p)), grp = q.filter(x => x.p === minP);
  const x = cur && cur.p === minP ? grp[(grp.indexOf(cur) + 1) % grp.length] : grp[0];
  select({g:x.g, t:x.t, c:x.c, s:x.p === 0 ? (items.find(it => it.st === "review" && it.t === x.t && it.c === x.c) || {}).s : null}, {go:true});
  toast("הבא: " + T[x.t].n + " › " + x.c + " · " + ["תוקן, מחכה לאישור שלך","הוחזר לתיקון","השתנה מאז שנבדק","עוד לא נבדק"][x.p]);
}

/* ── Events ── */

document.addEventListener("input", (e) => {
  if(e.target.id === "q"){ S.q = e.target.value.trim();
    const m = S.q.match(/^#?(\d{2,3})$/); renderTree(); return; }
  if(e.target.id === "rep-ta"){ S.rep.text = e.target.value; const b = $('[data-act="rep-send"]'); if(b) b.disabled = !(S.rep.reason || S.rep.text.trim()); const pv = $("#body-pv"); if(pv) pv.textContent = buildBody(S.rep); }
  if(e.target.id === "it-ta") S.itemText = e.target.value;
  if(e.target.id === "pv-in" && S.ex){ S.ex.typed = e.target.value; }
});
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea";
  if(e.key === "Escape"){ if($("#help").classList.contains("on")) renderHelp(false); else if(S.rep){ S.rep = null; renderRep(); } else if(S.sheet){ S.sheet = false; renderPhone(); } else if(typing) e.target.blur(); return; }
  if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ if(S.rep && (S.rep.reason || S.rep.text.trim())){ e.preventDefault(); sendRep(); } return; }
  if(e.target.id === "q" && e.key === "Enter"){ const m = S.q.match(/^#?(\d{2,3})$/); if(m){ const it = items.find(i => i.id === +m[1]); if(it){ document.querySelector('[data-act="goto"]'); const g = it.t ? gradesOf(it.t)[0]?.id || "hid" : (it.g || "all"); S.q = ""; select({g, t:it.t, c:it.c, s:it.s}); S.openItem = it.id; renderInsp(); } } return; }
  if(e.target.id === "pv-in" && e.key === "Enter"){ document.querySelector('[data-act="pv-check"]').click(); return; }
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if(k === "/"){ e.preventDefault(); const q = $("#q"); if(q){ if(isPhone()){ S.step = "tree"; renderPhone(); } q.focus(); } return; }
  if(k === "?"){ renderHelp(true); return; }
  if(k === "n" && S.sel.t){ ensureEx(true); renderStage(); renderInsp(); return; }
  if(k === "r"){ S.sel.t ? openRep("question") : openRep(node().lvl); return; }
  if(k === "v" && S.sel.c){ document.querySelector('[data-act="check"]')?.click(); return; }
  if(k === "g"){ nextToCheck(); return; }
  if(k === "p"){ S.device = S.device === "phone" ? "desk" : "phone"; renderStage(); return; }
  if(k === "o"){ S.onlyOpen = !S.onlyOpen; renderCtl(); renderTree(); return; }
  if(k === "ArrowDown" || k === "ArrowUp" || k === "j" || k === "k"){
    const rows = [...document.querySelectorAll("#tree .tr")]; if(!rows.length) return; e.preventDefault();
    const cur = rows.findIndex(r => r.getAttribute("aria-selected") === "true");
    const nx = rows[Math.max(0, Math.min(rows.length - 1, cur + (k === "ArrowDown" || k === "j" ? 1 : -1)))];
    nx.click(); return;
  }
  if(k === "ArrowLeft" || k === "ArrowRight"){
    const r = $('#tree [aria-selected="true"]'); if(!r) return; const kk = r.dataset.k; if(kk.startsWith("s|") || kk === "g|all") return;
    e.preventDefault(); if(k === "ArrowLeft") S.open.add(kk); else S.open.delete(kk); renderTree(); return;
  }
});
let rz = 0;
addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { renderStage(); renderRep(); }); });

document.documentElement.lang = "he";
ensureEx();
S.seen[qKey()] = 4; /* the sample session: this is the 4th question seen here */
render();
})();
</script>
