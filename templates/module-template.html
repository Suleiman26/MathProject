<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שם הנושא — כיתה ז׳</title>
<meta name="theme-color" content="#f5f5f2">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  New topic template. Copy this file to the project root (next to index.html).
  1. Set data-topic above: teal, sky, blue, indigo, violet, pink, cyan or orange.
  2. Write the exercise in the text/babel block below.
  3. Use the class names from DESIGN.md and the page styles itself.
  Spacing for the standard classes comes from the design system already.
  Only layout that is special to this topic goes in the "legacy" block below
  (e.g. a drawing area). Don't add a "* { margin:0; padding:0 }" reset here:
  it would wipe out the design system's default spacing.
-->
<style>
@layer mp-base, legacy, mp, page;
@layer legacy {
  /* topic-specific layout only, for example:
     .drawing { display: flex; justify-content: center; margin: 12px 0; } */
}
</style>
<link rel="stylesheet" href="assets/mp.css?v=3">
<style id="mp-page">
@layer page {
}
</style>
<script src="assets/config.js?v=1" defer></script>
<script src="assets/mp-data.js?v=1" defer></script>
<script src="assets/mp.js?v=2" defer></script>
</head>
<body>
<div id="root"><div class="mp-boot" aria-hidden="true"><span></span></div></div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@8.0.7/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

// Example exercise: shows every building block. Replace it with the real topic.
function newExercise() {
  const a = 2 + Math.floor(Math.random() * 8);
  const b = 2 + Math.floor(Math.random() * 8);
  return { a, b, answer: a * b };
}

function App() {
  const [chapter, setChapter] = useState(0);
  const [ex, setEx] = useState(newExercise);
  const [value, setValue] = useState('');
  const [fb, setFb] = useState(null);      // {ok: true/false, text}
  const [solved, setSolved] = useState(false);

  function check() {
    if (Number(value) === ex.answer) { setFb({ ok: true, text: '✓ נכון!' }); setSolved(true); }
    else setFb({ ok: false, text: '✗ לא נכון, נסו שוב' });
  }
  function next() { setEx(newExercise()); setValue(''); setFb(null); setSolved(false); }

  return (
    <div>
      <div className="hdr">
        <div className="hdr-title">שם הנושא</div>
        <div className="ch-btns">
          {['1. פרק ראשון', '2. פרק שני'].map((t, i) =>
            <button key={i} className={`ch-btn ${chapter === i ? 'active' : ''}`} onClick={() => setChapter(i)}>{t}</button>)}
        </div>
      </div>

      <div className="content">
        {solved && (
          <div className="banner">
            🎉 כל הכבוד!
            <button className="btn bp" onClick={next}>תרגיל הבא ←</button>
          </div>
        )}

        <div className="info-box">הסבר קצר על הנושא.</div>

        <div className="card">
          <div className="card-t">כפל</div>
          <div className="eq-box">{ex.a} × {ex.b} = ?</div>
          <div className="step-card">
            <div className="step-label">שלב 1 — חשבו</div>
            <div className="ans-row">
              <input value={value} onChange={e => setValue(e.target.value)} inputMode="numeric" placeholder="?" />
              <button className="btn bg" onClick={check}>✓ בדוק</button>
            </div>
            {fb && <div className={`fb ${fb.ok ? 'ok' : 'err'}`}>{fb.text}</div>}
          </div>
        </div>

        <div className="center"><button className="btn bp" onClick={next}>תרגיל חדש ↻</button></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
