<!DOCTYPE html>
<html lang="he" dir="rtl" data-topic="teal">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>פתרון משוואות</title>
<meta name="theme-color" content="#f5f5f2">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
@layer mp-base, legacy, mp, page;
@layer legacy {
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0fdfa;color:#1e293b;min-height:100vh;direction:rtl}

.hdr{background:linear-gradient(135deg,#134e4a,#0d9488);color:#fff;padding:18px 20px;text-align:center}
.hdr h1{margin:0;font-size:1.3rem}
.hdr-sub{display:block;margin-top:4px;font-size:.85rem;color:#99f6e4}

.content{max-width:640px;margin:20px auto;padding:0 16px 60px}
.card{background:#fff;border-radius:14px;padding:22px 18px;box-shadow:0 2px 10px rgba(19,78,74,.08);margin-bottom:16px}

/* ── Solve grid: op-boxes row + equation row share the same 3 columns, so each
     box centers exactly above its own side of the equation ── */
.solve-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;direction:ltr;row-gap:6px;overflow-x:auto;padding:2px 2px 4px}
.g-left{grid-column:1;justify-self:center}
.g-mid{grid-column:2;justify-self:center}
.g-right{grid-column:3;justify-self:center}
.eq-sign{font-size:1.8rem;color:#0d9488;padding:0 16px;font-weight:300;flex-shrink:0}
.side-zone{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:2px;padding:10px 14px;border-radius:12px;min-width:80px}

/* ── Term pills (static, read-only) ── */
.tp{display:inline-flex;align-items:center;gap:0;border-radius:10px;padding:8px 10px}
.ts{font-size:1.5rem;color:#94a3b8;font-weight:300;padding:0 3px;line-height:1}
.tv{font-size:2rem;font-weight:700;color:#134e4a;line-height:1}
.tv-x{font-size:2rem;font-weight:700;color:#0d9488;line-height:1}
.tf{display:inline-flex;flex-direction:column;align-items:center;font-weight:700;color:#134e4a;margin:0 1px}
.tf .fn{border-bottom:2px solid #134e4a;padding:0 2px;font-size:1rem;line-height:1.3}
.tf .fd{padding:0 2px;font-size:1rem;line-height:1.3}

.hint{text-align:center;font-size:.88rem;color:#64748b;margin:12px 0}

/* ── Operation boxes (each box's 4 operators sit in a 2×2 grid, kept compact) ── */
.op-box{display:flex;align-items:center;gap:4px;background:#f0fdfa;border:2px solid #99f6e4;border-radius:10px;padding:5px 7px}
.op-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.op-btn{width:22px;height:22px;border-radius:5px;border:1px solid #5eead4;background:#fff;color:#0f766e;font-size:.8rem;font-weight:700;cursor:pointer;transition:.12s;padding:0;flex-shrink:0}
.op-btn:hover{background:#ccfbf1}
.op-btn.active{background:#0d9488;color:#fff;border-color:#0d9488}
.op-input{width:30px;flex-shrink:0;padding:3px 1px;border:2px solid #5eead4;border-radius:5px;text-align:center;font-size:.8rem;direction:ltr}
.op-input:focus{outline:none;border-color:#0d9488}
.op-x-btn{width:22px;height:22px;flex-shrink:0;border-radius:5px;border:1px solid #5eead4;background:#fff;color:#0f766e;font-size:.78rem;font-weight:700;font-style:italic;cursor:pointer;transition:.12s;padding:0}
.op-x-btn:hover{background:#ccfbf1}
.op-x-btn.active{background:#0f766e;color:#fff;border-color:#0f766e}

.action-row{display:flex;justify-content:center;gap:10px;margin-top:16px}

/* ── Buttons ── */
.btn{background:#ccfbf1;border:1px solid #5eead4;color:#0f766e;padding:10px 24px;border-radius:9px;cursor:pointer;font-size:.92rem;font-weight:700;transition:.12s}
.btn:hover{background:#99f6e4}
.btn:disabled{opacity:.35;cursor:not-allowed}
.bp{background:#0d9488;color:#fff;border-color:#0d9488}
.bp:hover{background:#0f766e}

.fb{text-align:center;font-weight:700;margin-top:8px;font-size:.9rem}
.fb.err{color:#dc2626}

/* ── Success banner ── */
.banner{background:#f0fdf4;border:2px solid #86efac;color:#166534;border-radius:14px;padding:18px;text-align:center;font-size:1.05rem;font-weight:700;margin-bottom:16px}
.s-val{font-size:1.7rem;font-weight:800;color:#047857;direction:ltr;margin-top:6px}

/* ── History (kept as-is: good documentation) ── */
.hist-label{font-size:.72rem;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;text-align:right}
.h-row{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;direction:ltr}
.h-row:last-child{border-bottom:none}
.h-num{min-width:20px;height:20px;background:#ccfbf1;border-radius:50%;font-size:.68rem;font-weight:700;color:#0f766e;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.h-eq{font-size:.96rem;font-weight:600;color:#134e4a;flex:1}
.h-desc{font-size:.72rem;color:#94a3b8;direction:rtl;text-align:right;white-space:nowrap}

.bottom{display:flex;gap:10px;direction:rtl}
.bottom .btn{flex:1;text-align:center}
}
</style>
<link rel="stylesheet" href="assets/mp.css?v=3">
<style id="mp-page">
@layer page {
}
</style>
<script src="assets/config.js?v=1" defer></script>
<script src="assets/mp-data.js?v=1" defer></script>
<script src="assets/mp.js?v=2" defer></script>

</head>
<body>
<div id="root"><div class="mp-boot" aria-hidden="true"><span></span></div></div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@8.0.7/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo } = React;

/* ── Math ─────────────────────────────────────────────────────────────────── */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){let t=b;b=a%b;a=t;}return a||1}
function simplify(num,den){if(num===0)return[0,1];if(den<0){num=-num;den=-den;}const g=gcd(Math.abs(num),den);return[num/g,den/g]}
function addFracs(n1,d1,n2,d2){return simplify(n1*d2+n2*d1,d1*d2)}

/* ── Terms ────────────────────────────────────────────────────────────────── */
let _uid=0;const uid=()=>`t${++_uid}`;
function mkTerm(type,num,den=1){const[n,d]=simplify(num,den);return{id:uid(),type,num:n,den:d}}

function sideStr(terms){
  if(!terms.length)return'0';
  return terms.map((t,i)=>{
    const abs=Math.abs(t.num);
    const sign=t.num<0?(i===0?'−':' − '):(i===0?'':' + ');
    const frac=t.den===1?`${abs}`:`${abs}/${t.den}`;
    return t.type==='const'?`${sign}${frac}`:`${sign}${abs===t.den?'':frac}x`;
  }).join('');
}
function eqStr(eq){return`${sideStr(eq.left)} = ${sideStr(eq.right)}`}

/* ── Operations ───────────────────────────────────────────────────────────── */
/* Apply the SAME operation to both sides of the equation (add/subtract/multiply/divide). */
function doOperate(eq,opType,k,isX){
  const type=isX?'x':'const';
  function applySide(terms){
    if(opType==='+')return[...terms,mkTerm(type,k)];
    if(opType==='−')return[...terms,mkTerm(type,-k)];
    if(opType==='×')return terms.map(t=>mkTerm(t.type,t.num*k,t.den));
    if(opType==='÷')return terms.map(t=>{const[n,d]=simplify(t.num,t.den*Math.abs(k));return mkTerm(t.type,k<0?-n:n,d)});
    return terms;
  }
  return{left:applySide(eq.left),right:applySide(eq.right)};
}
function opDesc(opType,k,isX){
  const q=isX?`${k}x`:`${k}`;
  const labels={'+':`הוספת ${q}`,'−':`חיסור ${q}`,'×':`כפל ב-${k}`,'÷':`חילוק ב-${k}`};
  return `${labels[opType]} משני האגפים`;
}
function doSimplify(terms){
  let xn=0,xd=1,cn=0,cd=1;
  for(const t of terms){if(t.type==='x')[xn,xd]=addFracs(xn,xd,t.num,t.den);else[cn,cd]=addFracs(cn,cd,t.num,t.den)}
  const r=[];
  if(xn!==0)r.push(mkTerm('x',xn,xd));
  if(cn!==0)r.push(mkTerm('const',cn,cd));
  return r.length?r:[mkTerm('const',0)];
}
function canSimp(terms){return terms.filter(t=>t.type==='x').length>1||terms.filter(t=>t.type==='const').length>1}
function checkSolved(eq){
  const isX=t=>t.type==='x'&&t.num===1&&t.den===1;
  const isC=t=>t.type==='const'&&t.den===1;
  if(eq.left.length===1&&isX(eq.left[0])&&eq.right.length===1&&isC(eq.right[0]))return eq.right[0].num;
  if(eq.right.length===1&&isX(eq.right[0])&&eq.left.length===1&&isC(eq.left[0]))return eq.left[0].num;
  return null;
}
function genEq(){
  for(let i=0;i<300;i++){
    const n=(Math.floor(Math.random()*9)+1)*(Math.random()<.5?1:-1);
    const a=Math.floor(Math.random()*4)+1;
    const c=Math.floor(Math.random()*a);
    const b=Math.floor(Math.random()*11)-5;
    const d=b+n*(a-c);
    if(Math.abs(d)>18)continue;
    const left=[mkTerm('x',a)];
    if(b!==0)left.push(mkTerm('const',b));
    const right=[];
    if(c!==0)right.push(mkTerm('x',c));
    if(d!==0)right.push(mkTerm('const',d));
    if(!right.length)right.push(mkTerm('const',0));
    if(left.length+right.length<3)continue;
    return{left,right};
  }
  return{left:[mkTerm('x',3),mkTerm('const',-2)],right:[mkTerm('x',1),mkTerm('const',4)]};
}

/* ── TermPill (static display) ───────────────────────────────────────────── */
function TermPill({term,index}){
  const{type,num,den}=term;
  const isNeg=num<0;const abs=Math.abs(num);
  const body=()=>{
    if(type==='const'){
      if(den===1)return<span className="tv">{abs}</span>;
      return<span className="tf"><span className="fn">{abs}</span><span className="fd">{den}</span></span>;
    }
    const showC=!(abs===den);
    const coef=showC?(den===1?<span className="tv">{abs}</span>:<span className="tf"><span className="fn">{abs}</span><span className="fd">{den}</span></span>):null;
    return<>{coef}<span className="tv-x">x</span></>;
  };
  return(
    <span className="tp">
      {index>0&&<span className="ts">{isNeg?'−':'+'}</span>}
      {index===0&&isNeg&&<span className="ts">−</span>}
      {body()}
    </span>
  );
}

/* ── Operation box (two rendered instances share the same state → mirrored) ── */
const OPS=['+','−','×','÷'];
function OpBox({opType,opVal,opIsX,onOpType,onOpVal,onToggleX}){
  const allowX=opType==='+'||opType==='−';
  return(
    <div className="op-box">
      <div className="op-btns">
        {OPS.map(op=><button key={op} className={`op-btn ${opType===op?'active':''}`} onClick={()=>onOpType(op)}>{op}</button>)}
      </div>
      <input className="op-input" value={opVal} onChange={e=>onOpVal(e.target.value)} placeholder="מס׳" inputMode="numeric"/>
      {allowX&&<button className={`op-x-btn ${opIsX?'active':''}`} onClick={onToggleX} title="הוספה/חיסור של כפולת x">x</button>}
    </div>
  );
}

/* ── App ──────────────────────────────────────────────────────────────────── */
function App(){
  const[app,setApp]=useState(()=>{const eq=genEq();return{initial:eq,current:eq,history:[]}});
  const[opType,setOpType]=useState('+');
  const[opVal,setOpVal]=useState('');
  const[opIsX,setOpIsX]=useState(false);
  const[opErr,setOpErr]=useState('');

  const{current:cur,history:hist,initial:init}=app;
  const solved=useMemo(()=>checkSolved(cur),[cur]);
  const canSimpAny=canSimp(cur.left)||canSimp(cur.right);

  function setOpValClean(v){setOpVal(v);setOpErr('')}
  function setOpTypeClean(t){setOpType(t);setOpErr('');if(t==='×'||t==='÷')setOpIsX(false)}
  function toggleOpIsX(){setOpIsX(v=>!v);setOpErr('')}

  function applyOp(){
    const v=opVal.trim();
    if(!/^-?\d+$/.test(v)){setOpErr('הזינו מספר שלם');return}
    const k=parseInt(v,10);
    if(k===0){setOpErr('בחרו מספר שאינו אפס');return}
    const isX=opIsX&&(opType==='+'||opType==='−');
    setApp(s=>({...s,current:doOperate(s.current,opType,k,isX),history:[...s.history,{eq:s.current,desc:opDesc(opType,k,isX)}]}));
    setOpVal('');setOpErr('');setOpIsX(false);
  }

  function handleSimplify(){
    setApp(s=>{
      const left=canSimp(s.current.left)?doSimplify(s.current.left):s.current.left;
      const right=canSimp(s.current.right)?doSimplify(s.current.right):s.current.right;
      return{...s,current:{left,right},history:[...s.history,{eq:s.current,desc:'פישוט'}]};
    });
  }

  function newEq(){const eq=genEq();setApp({initial:eq,current:eq,history:[]});setOpVal('');setOpErr('');setOpType('+');setOpIsX(false)}
  function resetEq(){setApp(s=>({...s,current:s.initial,history:[]}));setOpVal('');setOpErr('');setOpType('+');setOpIsX(false)}

  const renderTerms=(terms)=>terms.map((t,i)=><TermPill key={t.id} term={t} index={i}/>);

  return(
    <div>
      <div className="hdr">
        <h1>פתרון משוואות בנעלם אחד</h1>
        <span className="hdr-sub">כיתה ז׳</span>
      </div>
      <div className="content">

        {solved!==null&&(
          <div className="banner">
            🎉 כל הכבוד! פתרת את המשוואה
            <div className="s-val">x = {solved}</div>
          </div>
        )}

        <div className="card">
          {solved===null&&<div className="hint">בצעו את אותה פעולה על שני אגפי המשוואה — בחיבור/חיסור ניתן גם להוסיף כפולת x (כפתור x)</div>}

          <div className="solve-grid">
            {solved===null&&<>
              <div className="g-left"><OpBox opType={opType} opVal={opVal} opIsX={opIsX} onOpType={setOpTypeClean} onOpVal={setOpValClean} onToggleX={toggleOpIsX}/></div>
              <div className="g-mid"></div>
              <div className="g-right"><OpBox opType={opType} opVal={opVal} opIsX={opIsX} onOpType={setOpTypeClean} onOpVal={setOpValClean} onToggleX={toggleOpIsX}/></div>
            </>}

            <div className="g-left side-zone">{renderTerms(cur.left)}</div>
            <span className="g-mid eq-sign">=</span>
            <div className="g-right side-zone">{renderTerms(cur.right)}</div>
          </div>

          {opErr&&<div className="fb err">{opErr}</div>}

          {solved===null&&(
            <div className="action-row">
              <button className="btn bp" onClick={applyOp}>✓ אישור</button>
              <button className="btn" disabled={!canSimpAny} onClick={handleSimplify}>פשט ≡</button>
            </div>
          )}
        </div>

        {hist.length>0&&(
          <div className="card">
            <div className="hist-label">שלבי הפתרון</div>
            {[{eq:init,desc:'משוואה מקורית'},...hist].map((s,i)=>(
              <div className="h-row" key={i}>
                <span className="h-num">{i+1}</span>
                <span className="h-eq">{eqStr(s.eq)}</span>
                <span className="h-desc">{s.desc}</span>
              </div>
            ))}
          </div>
        )}

        <div className="bottom">
          <button className="btn bp" onClick={newEq}>משוואה חדשה 🎲</button>
          <button className="btn" onClick={resetEq}>התחל מחדש ↺</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
