<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דמיון משולשים — כיתות ח׳-ט׳</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f2f5;min-height:100vh;}
.hdr{background:linear-gradient(135deg,#7c2d12,#ea580c);color:#fff;padding:14px 14px 12px;text-align:center;}
.hdr-title{font-size:22px;font-weight:700;margin-bottom:8px;}
.ch-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.ch-btn{padding:6px 14px;border:2px solid rgba(255,255,255,0.4);border-radius:8px;background:transparent;color:rgba(255,255,255,0.85);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.ch-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
.ch-btn.active{background:rgba(255,255,255,0.25);border-color:#fff;color:#fff;}
.sub-tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.sub-tab{padding:6px 14px;border:2px solid #fed7aa;border-radius:20px;background:#fff;color:#c2410c;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.sub-tab.active{background:#c2410c;color:#fff;border-color:#c2410c;}
.content{max-width:820px;margin:20px auto;padding:0 16px;}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:14px;}
.card-t{font-size:17px;font-weight:700;color:#c2410c;margin-bottom:10px;border-bottom:2px solid #e5e7eb;padding-bottom:6px;text-align:center;}
.btn{padding:7px 18px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s;}
.btn:disabled{opacity:.4;cursor:default;}
.bp{background:#c2410c;color:#fff;}.bp:hover:not(:disabled){background:#9a3412;}
.bg{background:#16a34a;color:#fff;}.bg:hover:not(:disabled){background:#15803d;}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:14px;text-align:center;}
.fb.ok{background:#dcfce7;color:#166534;}
.fb.err{background:#fee2e2;color:#991b1b;}
input[type=text],input[type=number],input:not([type]){padding:5px 8px;border:2px solid #d1d5db;border-radius:6px;font-size:16px;text-align:center;direction:ltr;width:80px;}
input:focus{outline:none;border-color:#c2410c;}
.banner{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;padding:20px;border-radius:12px;text-align:center;font-size:20px;font-weight:700;margin-bottom:14px;}
.center{text-align:center;}
.step-card{background:#f8fafc;border:2px solid #e5e7eb;border-radius:10px;padding:14px;margin-top:12px;}
.step-card.done{border-color:#16a34a;background:#f0fdf4;}
.step-label{font-size:14px;font-weight:700;color:#c2410c;margin-bottom:8px;}
.ans-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;direction:ltr;flex-wrap:wrap;}
.hint{font-size:13px;color:#6b7280;text-align:center;margin:6px 0;}
.choice-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.choice-btn{padding:8px 16px;border:2px solid #d1d5db;border-radius:8px;background:#f8fafc;color:#334155;font-size:14px;cursor:pointer;font-weight:600;transition:all .2s;}
.choice-btn:hover{border-color:#c2410c;color:#c2410c;}
.choice-btn.active{background:#ffedd5;border-color:#c2410c;color:#c2410c;}
.info-box{background:#fff7ed;border:2px solid #fed7aa;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:#7c2d12;line-height:1.7;}
.info-box b{color:#c2410c;}
.given-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:8px 12px;text-align:center;font-size:14px;color:#0c4a6e;margin:8px 0;}
.tri-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.tri-wrap{display:flex;flex-direction:column;align-items:center;}
@media(max-width:500px){input{width:60px;font-size:14px;}.choice-btn{font-size:12px;padding:6px 10px;}.ch-btn{font-size:11px;padding:5px 10px;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

/* ═══════════════════ Utilities ═══════════════════ */
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[randInt(0,arr.length-1)];}
const RATIO_PAIRS=[[1,2],[2,3],[3,4]];
function pickRatioPair(){ return pick(RATIO_PAIRS); }
const UNIT_TRIS=[[3,4,5],[2,3,4],[4,5,6],[3,5,6],[2,2,3],[4,4,5],[3,3,2],[5,6,7]];
function pickUnitTri(){ return pick(UNIT_TRIS); }
const PY_TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17]];
function pickTriple(){ const t=pick(PY_TRIPLES); return Math.random()<0.5?[t[0],t[1],t[2]]:[t[1],t[0],t[2]]; }

function parseRatio(text){
  const s=String(text).trim().replace(/\s+/g,'');
  let m=s.match(/^(\d+(?:\.\d+)?)[:\/](\d+(?:\.\d+)?)$/);
  if(m) return [parseFloat(m[1]),parseFloat(m[2])];
  const v=parseFloat(s);
  if(!isNaN(v)&&s!=='') return [v,1];
  return null;
}
function ratioCrossMatches(text,p,q){
  const r=parseRatio(text); if(!r) return false;
  const [a,b]=r; if(b===0) return false;
  return Math.abs(a*q-b*p)<1e-6;
}
function ratioValueMatches(text,num,den){
  const r=parseRatio(text); if(!r) return false;
  const [a,b]=r; if(b===0) return false;
  const target=num/den, val=a/b;
  return Math.abs(val-target) < Math.max(0.01, Math.abs(target)*0.02);
}

/* ═══════════════════ Equation-check helpers (proportion with '?') ═══════════════════ */
function safeEvalExpr(expr){
  if(!/^[0-9+\-*/().\s]+$/.test(expr)) return NaN;
  try{ const v=Function('"use strict";return ('+expr+')')(); return typeof v==='number'&&isFinite(v)?v:NaN; }
  catch(e){ return NaN; }
}
function numsInExpr(expr){ return (expr.match(/\d+(?:\.\d+)?/g)||[]).map(Number); }
function checkEquation(text, unknownVal, requiredNums){
  const raw=String(text).trim();
  if((raw.match(/\?/g)||[]).length!==1 || (raw.match(/=/g)||[]).length!==1) return false;
  const filled=raw.replace('?', String(unknownVal));
  const parts=filled.split('=');
  const lv=safeEvalExpr(parts[0]), rv=safeEvalExpr(parts[1]);
  if(isNaN(lv)||isNaN(rv)||Math.abs(lv-rv)>1e-6) return false;
  const nums=numsInExpr(raw.replace('?',''));
  return requiredNums.every(r=>nums.some(n=>Math.abs(n-r)<1e-9));
}

/* ═══════════════════ Feedback ═══════════════════ */
function Fb({fb}){
  if(!fb) return null;
  return fb==='ok'?<div className="fb ok">✓ נכון!</div>:<div className="fb err">✗ לא נכון, נסה שוב.</div>;
}

/* ═══════════════════ Geometry: angle arc ═══════════════════ */
function angleArcAtVertex(vx,vy,p1,p2,radius){
  const a1=Math.atan2(p1.y-vy,p1.x-vx);
  const a2=Math.atan2(p2.y-vy,p2.x-vx);
  let start=a1,end=a2;
  let diff=(end-start+2*Math.PI)%(2*Math.PI);
  if(diff>Math.PI){const t=start;start=end;end=t;diff=2*Math.PI-diff;}
  const sx=vx+radius*Math.cos(start),sy=vy+radius*Math.sin(start);
  const ex=vx+radius*Math.cos(end),ey=vy+radius*Math.sin(end);
  const large=diff>Math.PI?1:0;
  return{path:`M${sx},${sy}A${radius},${radius} 0 ${large} 1 ${ex},${ey}`, midAngle:start+diff/2};
}
function RightMark({v,prev,next,active}){
  const a1=Math.atan2(prev.y-v.y,prev.x-v.x), a2=Math.atan2(next.y-v.y,next.x-v.x);
  const s=13;
  const p1x=v.x+s*Math.cos(a1),p1y=v.y+s*Math.sin(a1);
  const p2x=v.x+s*Math.cos(a2),p2y=v.y+s*Math.sin(a2);
  const p3x=p1x+(p2x-v.x), p3y=p1y+(p2y-v.y);
  return <polyline points={`${p1x},${p1y} ${p3x},${p3y} ${p2x},${p2y}`} fill="none" stroke={active?'#c2410c':'#94a3b8'} strokeWidth={active?3:1.5}/>;
}

/* ═══════════════════ Generic single-triangle diagram ═══════════════════ */
function Tri({verts, order, sideLabels={}, angleLabels={}, angleGroup={}, rightAngleAt=null,
  activeAngles, activeSides, onSide, onAngle, size=220}){
  activeAngles = activeAngles || new Set();
  activeSides = activeSides || new Set();
  const pts=order.map(k=>verts[k]);
  const cx=pts.reduce((s,p)=>s+p.x,0)/3, cy=pts.reduce((s,p)=>s+p.y,0)/3;
  const sides=order.map((k,i)=>({id:k+order[(i+1)%3], a:verts[k], b:verts[order[(i+1)%3]]}));
  return (
    <svg viewBox="0 0 260 210" style={{width:'100%',maxWidth:size,height:'auto',direction:'ltr'}}>
      <polygon points={pts.map(p=>`${p.x},${p.y}`).join(' ')} fill="#fff7ed" stroke="none"/>
      {sides.map(s=>{
        const midx=(s.a.x+s.b.x)/2, midy=(s.a.y+s.b.y)/2;
        const dx=s.b.x-s.a.x, dy=s.b.y-s.a.y, len=Math.hypot(dx,dy)||1;
        const ux=dx/len, uy=dy/len;
        const outSign=((midx-cx)*(-uy)+(midy-cy)*(ux))>=0?1:-1;
        const nx=-uy*outSign, ny=ux*outSign;
        const active=activeSides.has(s.id);
        return <g key={s.id} style={{cursor:onSide?'pointer':'default'}} onClick={()=>onSide&&onSide(s.id)}>
          <line x1={s.a.x} y1={s.a.y} x2={s.b.x} y2={s.b.y} stroke={active?'#c2410c':'#334155'} strokeWidth={active?4:2.5}/>
          <line x1={s.a.x} y1={s.a.y} x2={s.b.x} y2={s.b.y} stroke="transparent" strokeWidth={16}/>
          {sideLabels[s.id]!=null&&<text x={midx+nx*16} y={midy+ny*16+4} textAnchor="middle" fontSize="13" fontWeight="700" fill={active?'#c2410c':'#334155'}>{sideLabels[s.id]}</text>}
        </g>;
      })}
      {order.map((k,i)=>{
        const v=verts[k];
        const prev=verts[order[(i-1+3)%3]], next=verts[order[(i+1)%3]];
        const active=activeAngles.has(k);
        const isRight=rightAngleAt===k;
        const group=angleGroup[k]||0;
        const arcRef=angleArcAtVertex(v.x,v.y,prev,next,20);
        const bis=arcRef.midAngle;
        const inX=v.x+32*Math.cos(bis), inY=v.y+32*Math.sin(bis)+4;
        const outX=v.x-17*Math.cos(bis), outY=v.y-17*Math.sin(bis)+4;
        return <g key={k} style={{cursor:onAngle?'pointer':'default'}} onClick={()=>onAngle&&onAngle(k)}>
          <circle cx={v.x} cy={v.y} r={24} fill="transparent"/>
          {isRight? <RightMark v={v} prev={prev} next={next} active={active}/>
            : group>0 ? Array.from({length:group}).map((_,gi)=>{
                const r=15+gi*5;
                const arc=angleArcAtVertex(v.x,v.y,prev,next,r);
                return <path key={gi} d={arc.path} fill="none" stroke={active?'#c2410c':'#b45309'} strokeWidth={2}/>;
              })
            : <path d={arcRef.path} fill="none" stroke={active?'#c2410c':'#94a3b8'} strokeWidth={active?3:1.5}/>}
          {angleLabels[k]!=null&&<text x={inX} y={inY} textAnchor="middle" fontSize="12" fontWeight="700" fill={active?'#c2410c':'#78350f'}>{angleLabels[k]}</text>}
          <text x={outX} y={outY} textAnchor="middle" fontSize="13" fontWeight="700" fill="#1e293b">{k}</text>
        </g>;
      })}
    </svg>
  );
}

/* ═══════════════════ Similarity criteria reference box ═══════════════════ */
function CriteriaInfo(){
  return <div className="info-box">
    <b>שני תנאי דמיון עיקריים:</b><br/>
    <b>ז&quot;ז</b> — שתי זוויות שוות בשני המשולשים.&nbsp;&nbsp;
    <b>צ&quot;צ</b> — שני זוגות (או יותר) של צלעות מתאימות פרופורציוניות, ביחס שווה.
  </div>;
}

/* ═══════════════════ Reusable step widgets ═══════════════════ */
function ChoiceStep({options, correct, onDone, hint}){
  const [choice,setChoice]=useState(null);
  const [fb,setFb]=useState(null);
  const check=()=>{
    if(choice===correct){ setFb('ok'); setTimeout(onDone,500); }
    else setFb('err');
  };
  return <>
    {hint&&<p className="hint">{hint}</p>}
    <div className="choice-row">
      {options.map(o=>(
        <button key={o.key} className={`choice-btn ${choice===o.key?'active':''}`}
          onClick={()=>{setChoice(o.key);setFb(null);}}>{o.label}</button>
      ))}
    </div>
    <div className="center"><button className="btn bg" disabled={!choice} onClick={check}>✓ בדוק</button></div>
    <Fb fb={fb}/>
  </>;
}

function RatioStep({p,q,onDone,hint}){
  const [val,setVal]=useState('');
  const [fb,setFb]=useState(null);
  const check=()=>{
    if(ratioCrossMatches(val,p,q)){ setFb('ok'); setTimeout(onDone,500); }
    else setFb('err');
  };
  return <>
    {hint&&<p className="hint">{hint}</p>}
    <div className="ans-row">
      <input value={val} onChange={e=>{setVal(e.target.value);setFb(null);}}
        onKeyDown={e=>e.key==='Enter'&&check()} placeholder="לדוגמה 2:3" style={{width:110}}/>
      <button className="btn bg" onClick={check}>✓ בדוק</button>
    </div>
    <Fb fb={fb}/>
  </>;
}

function NumAnswerStep({label,unit,answer,onDone}){
  const [val,setVal]=useState('');
  const [fb,setFb]=useState(null);
  const check=()=>{
    const v=parseFloat(val);
    if(!isNaN(v)&&Math.abs(v-answer)<1e-6){ setFb('ok'); setTimeout(onDone,500); }
    else setFb('err');
  };
  return <>
    <div className="ans-row">
      <span>{label}</span>
      <input value={val} onChange={e=>{setVal(e.target.value);setFb(null);}}
        onKeyDown={e=>e.key==='Enter'&&check()}/>
      {unit&&<span>{unit}</span>}
      <button className="btn bg" onClick={check}>✓ בדוק</button>
    </div>
    <Fb fb={fb}/>
  </>;
}

function EquationStep({answer,requiredNums,onDone,hint}){
  const [val,setVal]=useState('');
  const [fb,setFb]=useState(null);
  const check=()=>{
    if(checkEquation(val,answer,requiredNums)){ setFb('ok'); setTimeout(onDone,500); }
    else setFb('err');
  };
  return <>
    <p className="hint">{hint||'כתוב פרופורציה עם ? במקום הצלע החסרה (למשל: 4/6=10/?)'}</p>
    <div className="ans-row">
      <input value={val} onChange={e=>{setVal(e.target.value);setFb(null);}}
        onKeyDown={e=>e.key==='Enter'&&check()} style={{width:170,direction:'ltr'}}/>
      <button className="btn bg" onClick={check}>✓ בדוק</button>
    </div>
    <Fb fb={fb}/>
  </>;
}

/* ══════════════════════════════════════════════════════════════════
   CHAPTER 1 — Identifying similarity
   ══════════════════════════════════════════════════════════════════ */
const T1_VERTS={A:{x:130,y:20},B:{x:30,y:190},C:{x:230,y:190}};
const T1_ORDER=['A','B','C'];
const T2_VERTS={D:{x:110,y:30},E:{x:20,y:160},F:{x:200,y:160}};
const T2_ORDER=['D','E','F'];

function genCh1A(){
  const angleSets=[[40,60],[30,80],[50,60],[35,95],[45,85],[35,40],[55,65],[30,100],[70,40],[25,65],[60,80]];
  let a,b,c;
  for(;;){ [a,b]=pick(angleSets); c=180-a-b; if(c>=10&&c<=140) break; }
  const t1angles={A:a,B:b,C:c};
  const t1keys=['A','B','C'];
  const vals=[a,b,c];
  const perms=[['D','E','F'],['E','F','D'],['F','D','E'],['D','F','E'],['F','E','D'],['E','D','F']];
  const perm=pick(perms);
  const hiddenPos=randInt(0,2);
  const t2angles={};
  perm.forEach((k,i)=>{ t2angles[k]= i===hiddenPos? null : vals[i]; });
  const pairs=[];
  perm.forEach((k,i)=>{ if(i!==hiddenPos) pairs.push([t1keys[i],k]); });
  const expected=new Set(); pairs.forEach(pr=>{expected.add(pr[0]);expected.add(pr[1]);});
  return {t1angles,t2angles,pairs,expected};
}

function genCh1Sides(similar){
  const [x,y,z]=pickUnitTri();
  const [p,q]=pickRatioPair();
  let s1=[p*x,p*y,p*z];
  let s2=[q*x,q*y,q*z];
  if(!similar){
    const idx=randInt(0,2);
    const delta=pick([1,-1,2,-2]);
    s2=[...s2]; s2[idx]=Math.max(1,s2[idx]+delta);
    if(Math.abs(s2[idx]*p - [p*x,p*y,p*z][idx]*q)<1e-9) s2[idx]+=1;
  }
  return {s1,s2,ratio:[p,q],similar};
}
const SIDE_PAIR_NAMES=[['AB','DE'],['BC','EF'],['CA','FD']];

/* Merged: each "תרגיל חדש" randomly gives an angle-based (ז"ז) or side-based (צ"צ) case */
function genCh1Identify(){
  const mode = Math.random()<0.5 ? 'angle' : 'side';
  return mode==='angle' ? {mode, ...genCh1A()} : {mode, ...genCh1Sides(true)};
}

function Ch1Identify(){
  const [data,setData]=useState(()=>genCh1Identify());
  const [phase,setPhase]=useState(0);
  const [selected,setSelected]=useState(new Set());
  const [revealed,setRevealed]=useState(false);
  const [ratios,setRatios]=useState(['','','']);
  const [fb,setFb]=useState(null);
  const reset=()=>{setData(genCh1Identify());setPhase(0);setSelected(new Set());setRevealed(false);setRatios(['','','']);setFb(null);};

  const toggle=(id)=>{ if(phase!==0) return; setFb(null); setSelected(s=>{const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n;}); };
  const checkAngles=()=>{
    const exp=data.expected;
    const ok=exp.size===selected.size && [...exp].every(id=>selected.has(id));
    if(ok){ setFb('ok'); setRevealed(true); setTimeout(()=>{setPhase(1);setFb(null);},700); }
    else setFb('err');
  };
  const checkRatios=()=>{
    const ok=[0,1,2].every(i=>ratioValueMatches(ratios[i], data.s1[i], data.s2[i]));
    if(ok){ setFb('ok'); setTimeout(()=>{setPhase(1);setFb(null);},500); } else setFb('err');
  };

  if(data.mode==='angle'){
    const t1Labels={}; T1_ORDER.forEach(k=>{ t1Labels[k]=data.t1angles[k]+'°'; });
    const t2Labels={}; T2_ORDER.forEach(k=>{ t2Labels[k]=data.t2angles[k]==null?'?':data.t2angles[k]+'°'; });
    const grp1={},grp2={};
    data.pairs.forEach((pr,gi)=>{ grp1[pr[0]]=gi+1; grp2[pr[1]]=gi+1; });
    const t1Active=new Set([...selected].filter(id=>T1_ORDER.includes(id)));
    const t2Active=new Set([...selected].filter(id=>T2_ORDER.includes(id)));
    return <div className="content">
      <CriteriaInfo/>
      <div className="card">
        <div className="card-t">זיהוי דמיון — לפי זוויות</div>
        <div className="tri-row">
          <div className="tri-wrap"><Tri verts={T1_VERTS} order={T1_ORDER} angleLabels={t1Labels}
            angleGroup={revealed?grp1:{}} activeAngles={t1Active} onAngle={toggle}/><b>משולש ABC</b></div>
          <div className="tri-wrap"><Tri verts={T2_VERTS} order={T2_ORDER} angleLabels={t2Labels}
            angleGroup={revealed?grp2:{}} activeAngles={t2Active}
            onAngle={id=>data.t2angles[id]!=null&&toggle(id)}/><b>משולש DEF</b></div>
        </div>
        {phase===0&&<>
          <p className="hint">לחץ על כל זוג זוויות שוות בשני המשולשים (בחר זווית אחת מכל משולש בכל זוג)</p>
          <div className="center"><button className="btn bg" onClick={checkAngles}>✓ בדוק</button></div>
          <Fb fb={fb}/>
        </>}
        {phase>=1&&<div className="step-card done"><div style={{color:'#16a34a',fontWeight:700,textAlign:'center'}}>✓ זוגות הזוויות השוות נמצאו</div></div>}
        {phase===1&&<div className="step-card">
          <div className="step-label">על פי איזה תנאי המשולשים דומים?</div>
          <ChoiceStep options={[{key:'zz',label:'ז"ז'},{key:'cc',label:'צ"צ'}]} correct="zz" onDone={()=>setPhase(2)}/>
        </div>}
        {phase>=2&&<div className="step-card done"><div style={{color:'#16a34a',fontWeight:700,textAlign:'center'}}>✓ דומים על פי ז&quot;ז</div></div>}
        <div className="center" style={{marginTop:10}}><button className="btn bp" onClick={reset}>תרגיל חדש ↺</button></div>

/* ---- Case A: line parallel to base ---- */
const CA_A={x:130,y:20}, CA_B={x:30,y:190}, CA_C={x:230,y:190};
const CA_D={x:CA_A.x+0.55*(CA_B.x-CA_A.x), y:CA_A.y+0.55*(CA_B.y-CA_A.y)};
const CA_E={x:CA_A.x+0.55*(CA_C.x-CA_A.x), y:CA_A.y+0.55*(CA_C.y-CA_A.y)};

function CaseADiagram({activeAngles, onAngle, sideLabels}){
  activeAngles=activeAngles||new Set();
  const mk=(v,prev,next,id)=>{
    const active=activeAngles.has(id);
    const arc=angleArcAtVertex(v.x,v.y,prev,next,20);
    return <g key={id} style={{cursor:onAngle?'pointer':'default'}} onClick={()=>onAngle&&onAngle(id)}>
      <circle cx={v.x} cy={v.y} r={22} fill="transparent"/>
      <path d={arc.path} fill="none" stroke={active?'#c2410c':'#94a3b8'} strokeWidth={active?3:1.5}/>
    </g>;
  };
  const midLabel=(P,Q,text)=>{
    if(text==null) return null;
    const mx=(P.x+Q.x)/2, my=(P.y+Q.y)/2;
    const dx=Q.x-P.x, dy=Q.y-P.y, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len*14, ny=dx/len*14;
    return <text x={mx+nx} y={my+ny+4} textAnchor="middle" fontSize="12" fontWeight="700" fill="#334155">{text}</text>;
  };
  return (
    <svg viewBox="0 0 260 210" style={{width:'100%',maxWidth:260,height:'auto',direction:'ltr'}}>
      <polygon points={`${CA_A.x},${CA_A.y} ${CA_B.x},${CA_B.y} ${CA_C.x},${CA_C.y}`} fill="#fff7ed" stroke="#334155" strokeWidth="2.5"/>
      <polygon points={`${CA_A.x},${CA_A.y} ${CA_D.x},${CA_D.y} ${CA_E.x},${CA_E.y}`} fill="#fed7aa" stroke="none" opacity="0.6"/>
      <line x1={CA_D.x} y1={CA_D.y} x2={CA_E.x} y2={CA_E.y} stroke="#c2410c" strokeWidth="2.5"/>
      <circle cx={CA_D.x} cy={CA_D.y} r="3.5" fill="#334155"/>
      <circle cx={CA_E.x} cy={CA_E.y} r="3.5" fill="#334155"/>
      {midLabel(CA_A,CA_D,sideLabels.AD)}
      {midLabel(CA_D,CA_B,sideLabels.DB)}
      {midLabel(CA_A,CA_E,sideLabels.AE)}
      {midLabel(CA_E,CA_C,sideLabels.EC)}
      {midLabel(CA_B,CA_C,sideLabels.BC)}
      {midLabel(CA_D,CA_E,sideLabels.DE)}
      {mk(CA_D,CA_A,CA_E,'D')}
      {mk(CA_B,CA_A,CA_C,'B')}
      {mk(CA_E,CA_A,CA_D,'E')}
      {mk(CA_C,CA_A,CA_B,'C')}
      <text x={CA_A.x} y={CA_A.y-10} textAnchor="middle" fontSize="13" fontWeight="700" fill="#1e293b">A</text>
      <text x={CA_B.x-14} y={CA_B.y+16} textAnchor="middle" fontSize="13" fontWeight="700" fill="#1e293b">B</text>
      <text x={CA_C.x+14} y={CA_C.y+16} textAnchor="middle" fontSize="13" fontWeight="700" fill="#1e293b">C</text>
      <text x={CA_D.x-16} y={CA_D.y-2} textAnchor="middle" fontSize="12" fontWeight="700" fill="#1e293b">D</text>
      <text x={CA_E.x+16} y={CA_E.y-2} textAnchor="middle" fontSize="12" fontWeight="700" fill="#1e293b">E</text>
    </svg>
  );
}

function genCh3A(){
  const [p,q]=pickRatioPair();
  const u=randInt(2,6), v=randInt(2,6), w=randInt(2,6);
  const AD=p*u, DB=q*u, AB=(p+q)*u;
  const AE=p*v, EC=q*v, AC=(p+q)*v;
  const BC=(p+q)*w, DE=p*w;
  return {p,q,AD,DB,AB,AE,EC,AC,BC,DE};
}

  };
  const t1Labels={AB:data.s1[0],BC:data.s1[1],CA:data.s1[2]};
  const t2Labels={DE:data.s2[0],EF:data.s2[1],FD:'?'};
  const t1Active=new Set([...selected].filter(id=>CB1_ORDER.includes(id)));
  const t2Active=new Set([...selected].filter(id=>CB2_ORDER.includes(id)));
  return <div className="content">
    <CriteriaInfo/>
    <div className="card">
      <div className="card-t">מקרה ב׳ — שני משולשים ישרי-זווית עם זווית חדה משותפת</div>
      <div className="tri-row">
        <div className="tri-wrap"><Tri verts={CB1_VERTS} order={CB1_ORDER} sideLabels={t1Labels}
          rightAngleAt="B" activeAngles={t1Active} onAngle={toggle}/><b>משולש ABC</b></div>
        <div className="tri-wrap"><Tri verts={CB2_VERTS} order={CB2_ORDER} sideLabels={t2Labels}
          rightAngleAt="E" activeAngles={t2Active} onAngle={toggle}/><b>משולש DEF</b></div>
      </div>
      <div className="given-box">בשני המשולשים: ∠A = ∠D (זווית חדה משותפת)</div>
      {phase===0&&<>
        <p className="hint">לחץ על הזוויות השוות (הזווית הישרה בשני המשולשים + הזווית החדה המשותפת)</p>
        <div className="center"><button className="btn bg" onClick={checkAngles}>✓ בדוק</button></div>
        <Fb fb={fb}/>
      </>}
      {phase>=1&&<div className="step-card done"><div style={{color:'#16a34a',fontWeight:700,textAlign:'center'}}>✓ ∠B=∠E=90° , ∠A=∠D</div></div>}
      {phase===1&&<div className="step-card">
        <ChoiceStep hint="על פי איזה תנאי דומים?" options={[{key:'zz',label:'ז"ז'},{key:'cc',label:'צ"צ'}]} correct="zz" onDone={()=>setPhase(2)}/>
      </div>}
      {phase>=2&&<div className="step-card done"><div style={{color:'#16a34a',fontWeight:700,textAlign:'center'}}>✓ דומים על פי ז&quot;ז</div></div>}
      {phase===2&&<div className="step-card">
        <div className="step-label">מצא את הצלע החסרה FD</div>
        <NumAnswerStep label="FD =" answer={data.s2[2]} onDone={()=>setPhase(3)}/>
      </div>}
      {phase>=3&&<div className="step-card done"><div style={{color:'#16a34a',fontWeight:700,textAlign:'center'}}>✓ FD = {data.s2[2]}</div></div>}
      <div className="center" style={{marginTop:10}}><button className="btn bp" onClick={reset}>תרגיל חדש ↺</button></div>
    </div>
  </div>;
}

/* ---- Case C: triangles sharing a vertex (vertical angles) ---- */
const CC_O={x:130,y:105}, CC_A={x:55,y:50}, CC_B={x:205,y:55};
const CC_C={x:CC_O.x+1.3*(CC_O.x-CC_A.x), y:CC_O.y+1.3*(CC_O.y-CC_A.y)};
const CC_D={x:CC_O.x+1.3*(CC_O.x-CC_B.x), y:CC_O.y+1.3*(CC_O.y-CC_B.y)};

function CaseCDiagram({activeAngles,onAngle,sideLabels}){
  activeAngles=activeAngles||new Set();
  const mk=(v,prev,next,id)=>{
    const active=activeAngles.has(id);
    const arc=angleArcAtVertex(v.x,v.y,prev,next,20);
    return <g key={id} style={{cursor:onAngle?'pointer':'default'}} onClick={()=>onAngle&&onAngle(id)}>
      <circle cx={v.x} cy={v.y} r={22} fill="transparent"/>
      <path d={arc.path} fill="none" stroke={active?'#c2410c':'#94a3b8'} strokeWidth={active?3:1.5}/>
    </g>;
  };
  const midLabel=(P,Q,text)=>{
    if(text==null) return null;
    const mx=(P.x+Q.x)/2, my=(P.y+Q.y)/2;
    const dx=Q.x-P.x, dy=Q.y-P.y, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len*14, ny=dx/len*14;
    return <text x={mx+nx} y={my+ny+4} textAnchor="middle" fontSize="12" fontWeight="700" fill="#334155">{text}</text>;
  };
  return (
    <svg viewBox="0 0 260 220" style={{width:'100%',maxWidth:260,height:'auto',direction:'ltr'}}>
      <polygon points={`${CC_A.x},${CC_A.y} ${CC_O.x},${CC_O.y} ${CC_B.x},${CC_B.y}`} fill="#fed7aa" stroke="#334155" strokeWidth="2.5" opacity="0.9"/>
      <polygon points={`${CC_C.x},${CC_C.y} ${CC_O.x},${CC_O.y} ${CC_D.x},${CC_D.y}`} fill="#fff7ed" stroke="#334155" strokeWidth="2.5"/>
      <line x1={CC_A.x} y1={CC_A.y} x2={CC_C.x} y2={CC_C.y} stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="4,3"/>
      <line x1={CC_B.x} y1={CC_B.y} x2={CC_D.x} y2={CC_D.y} stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="4,3"/>
      {midLabel(CC_A,CC_O,sideLabels.OA)}
      {midLabel(CC_B,CC_O,sideLabels.OB)}
      {midLabel(CC_A,CC_B,sideLabels.AB)}
      {midLabel(CC_C,CC_O,sideLabels.OC)}
      {midLabel(CC_D,CC_O,sideLabels.OD)}
      {midLabel(CC_C,CC_D,sideLabels.CD)}
      {mk(CC_O,CC_A,CC_B,'O1')}
      {mk(CC_O,CC_C,CC_D,'O2')}
      {mk(CC_A,CC_O,CC_B,'A')}
      {mk(CC_C,CC_O,CC_D,'C')}
      <text x={CC_A.x-12} y={CC_A.y-8} textAnchor="middle" fontSize="13" fontWeight="700" fill="#1e293b">A</text>
      <text x={CC_B.x+12} y={CC_B.y-8} textAnchor="middle" fontSize="13" fontWeight="700" fill="#1e293b">B</text>
      <text x={CC_O.x+2} y={CC_O.y+16} textAnchor="middle" fontSize="13" fontWeight="700" fill="#1e293b">O</text>
      <text x={CC_C.x+14} y={CC_C.y+8} textAnchor="middle" fontSize="13" fontWeight="700" fill="#1e293b">C</text>
      <text x={CC_D.x-14} y={CC_D.y+8} textAnchor="middle" fontSize="13" fontWeight="700" fill="#1e293b">D</text>
    </svg>
  );
}

function genCh3C(){
  const [x,y,z]=pickUnitTri();
  const [p,q]=pickRatioPair();
  const OA=p*x, OB=p*y, AB=p*z;
  const OC=q*x, OD=q*y, CD=q*z;
  return {OA,OB,AB,OC,OD,CD,ratio:[p,q]};
}

function Ch3CaseC(){
  const [data,setData]=useState(()=>genCh3C());
  const [phase,setPhase]=useState(0);
  const [selected,setSelected]=useState(new Set());
  const [fb,setFb]=useState(null);
  const reset=()=>{setData(genCh3C());setPhase(0);setSelected(new Set());setFb(null);};
  const expected=new Set(['O1','O2','A','C']);
  const toggle=(id)=>{ if(phase!==0) return; setFb(null); setSelected(s=>{const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n;}); };
  const checkAngles=()=>{
    const ok=expected.size===selected.size && [...expected].every(id=>selected.has(id));
    if(ok){ setFb('ok'); setTimeout(()=>{setPhase(1);setFb(null);},600); } else setFb('err');
  };
  const sideLabels={OA:data.OA,OB:data.OB,AB:data.AB,OC:data.OC,OD:data.OD,CD:phase>=2?'?':null};
  return <div className="content">
    <CriteriaInfo/>
    <div className="card">
      <div className="card-t">מקרה ג׳ — משולשים חולקים קודקוד (זוויות קודקודיות)</div>
      <div className="tri-row"><CaseCDiagram activeAngles={selected} onAngle={toggle} sideLabels={sideLabels}/></div>
      <div className="given-box">A,O,C על ישר אחד; B,O,D על ישר שני; AB ∥ CD</div>
      {phase===0&&<>
        <p className="hint">לחץ על הזוויות השוות (הזוויות הקודקודיות ב-O + זוג זוויות מתחלפות)</p>
        <div className="center"><button className="btn bg" onClick={checkAngles}>✓ בדוק</button></div>
        <Fb fb={fb}/>
      </>}
      {phase>=1&&<div className="step-card done"><div style={{color:'#16a34a',fontWeight:700,textAlign:'center'}}>✓ ∠AOB=∠COD (קודקודיות), ∠OAB=∠OCD (מתחלפות)</div></div>}
      {phase===1&&<div className="step-card">
        <ChoiceStep hint="על פי איזה תנאי דומים?" options={[{key:'zz',label:'ז"ז'},{key:'cc',label:'צ"צ'}]} correct="zz" onDone={()=>setPhase(2)}/>
      </div>}
      {phase>=2&&<div className="step-card done"><div style={{color:'#16a34a',fontWeight:700,textAlign:'center'}}>✓ דומים על פי ז&quot;ז</div></div>}
      {phase===2&&<div className="step-card">
        <div className="step-label">מצא את הצלע החסרה CD</div>
        <NumAnswerStep label="CD =" answer={data.CD} onDone={()=>setPhase(3)}/>
      </div>}
      {phase>=3&&<div className="step-card done"><div style={{color:'#16a34a',fontWeight:700,textAlign:'center'}}>✓ CD = {data.CD}</div></div>}
      <div className="center" style={{marginTop:10}}><button className="btn bp" onClick={reset}>תרגיל חדש ↺</button></div>
    </div>
  </div>;
}

function Ch3(){
  const [sub,setSub]=useState('a');
  return <div className="content">
    <div className="sub-tabs">
      <button className={`sub-tab ${sub==='a'?'active':''}`} onClick={()=>setSub('a')}>מקרה א׳ — קו מקביל</button>
      <button className={`sub-tab ${sub==='b'?'active':''}`} onClick={()=>setSub('b')}>מקרה ב׳ — זווית משותפת</button>
      <button className={`sub-tab ${sub==='c'?'active':''}`} onClick={()=>setSub('c')}>מקרה ג׳ — קודקוד משותף</button>
    </div>
    {sub==='a'&&<Ch3CaseA key="a"/>}
    {sub==='b'&&<Ch3CaseB key="b"/>}
    {sub==='c'&&<Ch3CaseC key="c"/>}
  </div>;
}

/* ═══════════════════ App root ═══════════════════ */
function App(){
  const [ch,setCh]=useState(1);
  const labels=['זיהוי דמיון','יחס דמיון וצלע חסרה','דמיון בתוך צורות'];
  return (
    <div>
      <div className="hdr">
        <div className="hdr-title">📐 דמיון משולשים — כיתות ח׳-ט׳</div>
        <div className="ch-btns">
          {labels.map((l,i)=><button key={i} className={`ch-btn ${ch===i+1?'active':''}`} onClick={()=>setCh(i+1)}>{i+1}. {l}</button>)}
        </div>
      </div>
      {ch===1?<Ch1 key="c1"/>:ch===2?<Ch2 key="c2"/>:<Ch3 key="c3"/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
