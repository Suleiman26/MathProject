<div id="root"><div class="mp-boot" aria-hidden="true"><span></span></div></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@8.0.7/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ================= generic helpers ================= */
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
const PI=3.14159265358979;
const PY_TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[9,12,15]];
function pickTriple(){ const t=pick(PY_TRIPLES); return Math.random()<0.5?[t[0],t[1],t[2]]:[t[1],t[0],t[2]]; }
const BOX_QUADS=[[3,4,12,13],[2,6,9,11],[6,6,7,11],[4,4,7,9],[2,3,6,7],[2,10,11,15]];
function pickQuad(){
  const q=pick(BOX_QUADS);
  const legs=[q[0],q[1],q[2]];
  // shuffle legs
  for(let i=legs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [legs[i],legs[j]]=[legs[j],legs[i]]; }
  return {l:legs[0],w:legs[1],h:legs[2],d:q[3]};
}

function safeEvalExpr(raw){
  if(typeof raw!=='string') return null;
  if(!/^[0-9+\-*/.()×÷√π²³\s]*$/.test(raw)) return null;
  let e = raw.replace(/×/g,'*').replace(/÷/g,'/').replace(/π/g,'('+PI+')').replace(/√/g,'Math.sqrt');
  e = e.replace(/Math\.sqrt(\d+(\.\d+)?)/g,'Math.sqrt($1)');
  e = e.replace(/(\d|\))(\s*)(\(|Math\.sqrt)/g,'$1*$3');
  e = e.replace(/\)²/g,')**2').replace(/\)³/g,')**3');
  e = e.replace(/(\d+(\.\d+)?)²/g,'($1**2)').replace(/(\d+(\.\d+)?)³/g,'($1**3)');
  try{
    const fn=new Function('Math','return ('+e+')');
    const v=fn(Math);
    return (typeof v==='number' && isFinite(v)) ? v : null;
  }catch(err){ return null; }
}
function numsInExpr(raw){
  const m=(raw||'').match(/\d+(\.\d+)?/g);
  return m ? m.map(Number) : [];
}
function checkNumericSolution(text,expected,requiredNums,tolerance){
  const raw=(text||'').trim();
  if(!raw) return false;
  const tol = tolerance!=null ? tolerance : Math.max(0.05, Math.abs(expected)*0.001);
  const parts = raw.split('=').map(s=>s.trim()).filter(Boolean);
  if(parts.length===0) return false;
  const lastExpr = parts[parts.length-1];
  const val = safeEvalExpr(lastExpr);
  if(val==null) return false;
  if(Math.abs(val-expected) > tol) return false;
  const nums = numsInExpr(raw);
  return (requiredNums||[]).every(n=> nums.includes(n));
}
function Fb({ok}){
  return <div className={`fb ${ok?'ok':'err'}`}>{ok?'✓ נכון!':'✗ לא נכון, נסו שוב'}</div>;
}
function Frac({num,den}){
  return <span className="frac"><span>{num}</span><span className="fl"></span><span>{den}</span></span>;
}

/* Universal free-text "equation + result" checked step */
function EquationResultInput({requiredNums,expected,placeholder,tolerance,onCorrect}){
  const [txt,setTxt]=useState('');
  const [fb,setFb]=useState(null);
  function check(){
    if(checkNumericSolution(txt,expected,requiredNums,tolerance)){ setFb('ok'); setTimeout(onCorrect,450); }
    else setFb('err');
  }
  return <div>
    <div className="ans-row">
      <input value={txt} onChange={e=>{setTxt(e.target.value);setFb(null);}} placeholder={placeholder} style={{minWidth:200}}
        onKeyDown={e=>{if(e.key==='Enter') check();}}/>
      <button className="btn bp" onClick={check}>✓ בדוק</button>
    </div>
    {fb==='err' && <Fb ok={false}/>}
    {fb==='ok' && <Fb ok={true}/>}
  </div>;
}

/* Coefficient + fixed root/π label input, e.g.  ___ √2  or  ___ π */
function CoeffSuffixInput({suffix,expectedCoeff,onCorrect}){
  const [txt,setTxt]=useState('');
  const [fb,setFb]=useState(null);
  function check(){
    const n=parseFloat(txt);
    if(!isNaN(n) && Math.abs(n-expectedCoeff)<0.001){ setFb('ok'); setTimeout(onCorrect,450); }
    else setFb('err');
  }
  return <div>
    <div className="ans-row">
      <input value={txt} onChange={e=>{setTxt(e.target.value);setFb(null);}} style={{width:90}}
        onKeyDown={e=>{if(e.key==='Enter') check();}}/>
      <span style={{fontSize:'1.2rem',fontWeight:700,color:'#0f766e'}}>{suffix}</span>
      <button className="btn bp" onClick={check}>✓ בדוק</button>
    </div>
    {fb==='err' && <Fb ok={false}/>}
    {fb==='ok' && <Fb ok={true}/>}
  </div>;
}

/* Sequential multi-step runner: steps = [{hint, render(onCorrect)}] */
function MultiStep({steps, doneMsg}){
  const [idx,setIdx]=useState(0);
  const [done,setDone]=useState(false);
  return <div>
    {steps.slice(0,idx).map((s,i)=><div key={i} className="step-done">✓ {s.hint}</div>)}
    {!done && idx<steps.length && <div>
      <div className="hint">{steps[idx].hint}</div>
      {steps[idx].render(()=>{
        if(idx+1>=steps.length) setDone(true);
        else setIdx(idx+1);
      })}
    </div>}
    {done && <div className="fb ok">{doneMsg || '✓ כל השלבים נפתרו נכון!'}</div>}
  </div>;
}

/* ================= isometric projection helper ================= */
const ISO_COS=Math.sqrt(3)/2, ISO_SIN=0.5;
function isoP(x,y,z){ return {X:(x-y)*ISO_COS, Y:(x+y)*ISO_SIN - z}; }
function makeProjector(pts3d, viewW, viewH, pad){
  const proj = pts3d.map(p=>isoP(p.x,p.y,p.z));
  const xs=proj.map(p=>p.X), ys=proj.map(p=>p.Y);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const w=(maxX-minX)||1, h=(maxY-minY)||1;
  const scale=Math.min((viewW-2*pad)/w,(viewH-2*pad)/h);
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const vcx=viewW/2, vcy=viewH/2;
  return function(x,y,z){
    const P=isoP(x,y,z);
    return {x: vcx+(P.X-cx)*scale, y: vcy+(P.Y-cy)*scale};
  };
}
function EdgeLabel({p1,p2,text,color,dx,dy}){
  const mx=(p1.x+p2.x)/2+(dx||0), my=(p1.y+p2.y)/2+(dy||0);
  return <text x={mx} y={my} fontSize="13" fontWeight="700" fill={color||'#334155'} textAnchor="middle">{text}</text>;
}

/* ================= Chapter 1: Cube ================= */
const CUBE_PARTS=[
  {id:'edge',label:'צלע',def:'קטע המחבר שני קודקודים סמוכים. בקובייה יש 12 צלעות שוות באורכן.'},
  {id:'face',label:'פאה',def:'ריבוע. לקובייה 6 פאות חופפות.'},
  {id:'vertex',label:'קודקוד',def:'נקודת מפגש של 3 צלעות. לקובייה 8 קודקודים.'},
  {id:'basediag',label:'אלכסון בסיס',def:'אלכסון של אחת הפאות (הריבועים); מחשבים אותו לפי פיתגורס: a√2.'},
  {id:'spacediag',label:'אלכסון מרחבי',def:'קטע המחבר שני קודקודים נגדיים דרך תוך הגוף; אורכו a√3.'},
];
function CubeSVG({a,activePart,showBaseDiag,showSpaceDiag}){
  const s=1; // unit cube, projector scales anyway
  const pts={
    A:{x:0,y:0,z:0}, B:{x:s,y:0,z:0}, C:{x:s,y:s,z:0}, D:{x:0,y:s,z:0},
    E:{x:0,y:0,z:s}, F:{x:s,y:0,z:s}, G:{x:s,y:s,z:s}, H:{x:0,y:s,z:s},
  };
  const p3=makeProjector(Object.values(pts),260,220,28);
  const P={}; Object.keys(pts).forEach(k=>P[k]=p3(pts[k].x,pts[k].y,pts[k].z));
  const edgeHi = activePart==='edge' ? '#16a34a':'#334155';
  const faceHi = activePart==='face';
  const vertHi = activePart==='vertex' ? '#16a34a':'#334155';
  return <svg viewBox="0 0 260 220" width="260" height="220">
    {faceHi && <polygon points={`${P.E.x},${P.E.y} ${P.F.x},${P.F.y} ${P.G.x},${P.G.y} ${P.H.x},${P.H.y}`} fill="#bbf7d0" opacity="0.7"/>}
    {/* hidden edges */}
    <line x1={P.A.x} y1={P.A.y} x2={P.D.x} y2={P.D.y} stroke="#94a3b8" strokeDasharray="4,3"/>
    <line x1={P.D.x} y1={P.D.y} x2={P.C.x} y2={P.C.y} stroke="#94a3b8" strokeDasharray="4,3"/>
    <line x1={P.D.x} y1={P.D.y} x2={P.H.x} y2={P.H.y} stroke="#94a3b8" strokeDasharray="4,3"/>
    {/* visible edges */}
    {[['A','B'],['B','C'],['A','E'],['B','F'],['C','G'],['E','F'],['F','G'],['G','H'],['E','H']].map(([u,v],i)=>
      <line key={i} x1={P[u].x} y1={P[u].y} x2={P[v].x} y2={P[v].y} stroke={edgeHi} strokeWidth="2.2"/>)}
    {showBaseDiag && <line x1={P.E.x} y1={P.E.y} x2={P.G.x} y2={P.G.y} stroke="#2563eb" strokeWidth="2.6" strokeDasharray="6,3"/>}
    {showSpaceDiag && <line x1={P.A.x} y1={P.A.y} x2={P.G.x} y2={P.G.y} stroke="#dc2626" strokeWidth="2.6"/>}
    {Object.entries(P).map(([k,p])=><circle key={k} cx={p.x} cy={p.y} r={vertHi==='#16a34a'?4:2.6} fill={vertHi}/>)}
    <EdgeLabel p1={P.A} p2={P.B} text={a} dx={0} dy={16}/>
    <EdgeLabel p1={P.B} p2={P.F} text={a} dx={14} dy={0}/>
    <EdgeLabel p1={P.A} p2={P.E} text={a} dx={-14} dy={0}/>
  </svg>;
}
function genCube(){ return {a:randInt(2,12)}; }
function Ch1PartA(){
  const [data]=useState(genCube);
  const [active,setActive]=useState(null);
  const part = CUBE_PARTS.find(p=>p.id===active);
  return <div className="step-card">
    <div className="svg-wrap"><CubeSVG a={data.a} activePart={active}
      showBaseDiag={active==='basediag'} showSpaceDiag={active==='spacediag'}/></div>
    <div className="parts-row">
      {CUBE_PARTS.map(p=><button key={p.id} className={`part-btn ${active===p.id?'active':''}`} onClick={()=>setActive(p.id)}>{p.label}</button>)}
    </div>
    <div className="def-box">{part ? part.def : 'לחצו על מרכיב כדי לראות הגדרה קצרה'}</div>
  </div>;
}
function Ch1PartB(){
  return <div className="step-card">
    <div className="formula-box">V = a³<small>נפח הקובייה = צלע בחזקת שלוש (הצלע מוכפלת בעצמה 3 פעמים)</small></div>
    <div className="formula-box">S = 6a²<small>שטח הפנים = סכום שטחי 6 הפאות הריבועיות החופפות</small></div>
    <div className="formula-box">d<sub>בסיס</sub> = a√2 &nbsp;,&nbsp; d = a√3<small>אלכסון פאה מתקבל מפיתגורס במישור; האלכסון המרחבי מתקבל מהפעלה נוספת של פיתגורס בין אלכסון הבסיס לגובה</small></div>
  </div>;
}
function Ch1Q1(){ // volume
  const [data,setData]=useState(genCube);
  const [done,setDone]=useState(false);
  function reset(){ setData(genCube()); setDone(false); }
  return <div className="step-card">
    <div className="given-box">צלע הקובייה: a = {data.a}</div>
    <div className="hint">חשבו את נפח הקובייה (הזינו את החישוב המלא והתוצאה)</div>
    {!done && <EquationResultInput requiredNums={[data.a]} expected={data.a**3} placeholder={`לדוגמה: ${data.a}×${data.a}×${data.a}=...`} onCorrect={()=>setDone(true)}/>}
    {done && <div className="banner">✅ כל הכבוד!<button className="btn bg" onClick={reset}>תרגיל חדש ↺</button></div>}
  </div>;
}
function Ch1Q2(){ // surface area
  const [data,setData]=useState(genCube);
  const [done,setDone]=useState(false);
  function reset(){ setData(genCube()); setDone(false); }
  return <div className="step-card">
    <div className="given-box">צלע הקובייה: a = {data.a}</div>
    <div className="hint">חשבו את שטח הפנים הכולל של הקובייה</div>
    {!done && <EquationResultInput requiredNums={[data.a]} expected={6*data.a*data.a} placeholder={`לדוגמה: 6×${data.a}×${data.a}=...`} onCorrect={()=>setDone(true)}/>}
    {done && <div className="banner">✅ כל הכבוד!<button className="btn bg" onClick={reset}>תרגיל חדש ↺</button></div>}
  </div>;
}
function Ch1Q3(){ // missing measure via base+space diagonal, two Pythagorean steps
  const [data,setData]=useState(genCube);
  const [done,setDone]=useState(false);
  function reset(){ setData(genCube()); setDone(false); }
  const {a}=data;
  return <div className="step-card">
    <div className="given-box">צלע הקובייה: a = {a}</div>
    <div className="hint">מצאו את האלכסון המרחבי של הקובייה בעזרת פיתגורס, צעד אחר צעד</div>
    <div className="svg-wrap"><CubeSVG a={a} showBaseDiag={true} showSpaceDiag={!done}/></div>
    {!done && <MultiStep doneMsg="✅ כל הכבוד! מצאתם את האלכסון המרחבי." steps={[
      {hint:`שלב 1: אלכסון הבסיס d_בסיס = a√2`, render:(onOk)=><CoeffSuffixInput suffix="√2" expectedCoeff={a} onCorrect={onOk}/>},
      {hint:`שלב 2: אלכסון מרחבי d = √(d_בסיס² + a²) = a√3`, render:(onOk)=><CoeffSuffixInput suffix="√3" expectedCoeff={a} onCorrect={()=>{onOk();setDone(true);}}/>},
    ]}/>}
    {done && <div className="banner">✅ כל הכבוד!<button className="btn bg" onClick={reset}>תרגיל חדש ↺</button></div>}
  </div>;
}
function Ch1Q4(){ // combined: given space diagonal (as a√3), find V and S
  const [data,setData]=useState(genCube);
  const [done,setDone]=useState(false);
  function reset(){ setData(genCube()); setDone(false); }
  const {a}=data;
  return <div className="step-card">
    <div className="given-box">האלכסון המרחבי של הקובייה: d = {a}√3</div>
    <div className="hint">מצאו את אורך הצלע, ולאחר מכן את הנפח ואת שטח הפנים</div>
    <div className="svg-wrap"><CubeSVG a={a} showSpaceDiag={true}/></div>
    {!done && <MultiStep doneMsg="✅ כל הכבוד!" steps={[
      {hint:'שלב 1: מצאו את אורך הצלע a', render:(onOk)=><EquationResultInput requiredNums={[]} expected={a} placeholder="a = ..." onCorrect={onOk}/>},
      {hint:'שלב 2: חשבו את נפח הקובייה', render:(onOk)=><EquationResultInput requiredNums={[a]} expected={a**3} placeholder={`לדוגמה: ${a}×${a}×${a}=...`} onCorrect={onOk}/>},

/* ================= shared: circular-solid ellipse helpers ================= */
function circlePts3D(r,z,n){
  const out=[];
  for(let i=0;i<n;i++){ const t=2*Math.PI*i/n; out.push({x:r*Math.cos(t), y:r*Math.sin(t), z}); }
  return out;
}
function ellipseArcs(projPts){
  const cy = projPts.reduce((s,p)=>s+p.y,0)/projPts.length;
  const front = projPts.filter(p=>p.y>=cy);
  const back = projPts.filter(p=>p.y<=cy);
  function sortByX(arr){ return [...arr].sort((a,b)=>a.x-b.x); }
  return {front:sortByX(front), back:sortByX(back)};
}
function pathFrom(pts){ if(!pts.length) return ''; return 'M'+pts.map(p=>`${p.x},${p.y}`).join(' L '); }

const CYL_PARTS=[
  {id:'base',label:'בסיס',def:'שני מעגלים חופפים ומקבילים (עליון ותחתון), שהם בסיסי הגליל.'},
  {id:'radius',label:'רדיוס (r)',def:'המרחק ממרכז הבסיס להיקפו.'},
  {id:'height',label:'גובה (h)',def:'המרחק בין שני הבסיסים, ניצב אליהם.'},
  {id:'lateral',label:'המעטפת',def:'המשטח המעוגל המחבר בין שני הבסיסים; כשפורשים אותו מתקבל מלבן שרוחבו 2πr וגובהו h.'},
];
function CylinderSVG({r,h,activePart}){
  const n=40;
  const bottom3=circlePts3D(r,0,n), top3=circlePts3D(r,h,n);
  const allPts=[...bottom3,...top3,{x:0,y:0,z:0},{x:0,y:0,z:h}];
  const p3=makeProjector(allPts,260,230,26);
  const bottomP=bottom3.map(p=>p3(p.x,p.y,p.z));
  const topP=top3.map(p=>p3(p.x,p.y,p.z));
  const bc=p3(0,0,0), tc=p3(0,0,h);
  const {front,back}=ellipseArcs(bottomP);
  const leftT = topP.reduce((m,p)=>p.x<m.x?p:m, topP[0]);
  const rightT = topP.reduce((m,p)=>p.x>m.x?p:m, topP[0]);
  const leftB = bottomP.reduce((m,p)=>p.x<m.x?p:m, bottomP[0]);
  const rightB = bottomP.reduce((m,p)=>p.x>m.x?p:m, bottomP[0]);
  const baseHi = activePart==='base' ? '#16a34a' : '#334155';
  const latHi = activePart==='lateral' ? '#16a34a' : '#334155';
  return <svg viewBox="0 0 260 230" width="260" height="230">
    <path d={pathFrom(back)} fill="none" stroke={baseHi} strokeDasharray="4,3"/>
    <line x1={leftT.x} y1={leftT.y} x2={leftB.x} y2={leftB.y} stroke={latHi} strokeWidth="2.2"/>
    <line x1={rightT.x} y1={rightT.y} x2={rightB.x} y2={rightB.y} stroke={latHi} strokeWidth="2.2"/>
    <path d={pathFrom(front)} fill="none" stroke={baseHi} strokeWidth="2.2"/>
    <path d={pathFrom(topP)+' Z'} fill="none" stroke={baseHi} strokeWidth="2.2"/>
    {activePart==='height' && <line x1={bc.x} y1={bc.y} x2={tc.x} y2={tc.y} stroke="#ea580c" strokeWidth="2.6" strokeDasharray="5,3"/>}
    {activePart==='radius' && <line x1={tc.x} y1={tc.y} x2={rightT.x} y2={rightT.y} stroke="#2563eb" strokeWidth="2.6"/>}
    {activePart!=='height' && activePart!=='radius' && <>
      <line x1={bc.x} y1={bc.y} x2={tc.x} y2={tc.y} stroke="#ea580c" strokeWidth="1.6" strokeDasharray="5,3" opacity="0.55"/>
      <line x1={tc.x} y1={tc.y} x2={rightT.x} y2={rightT.y} stroke="#2563eb" strokeWidth="1.6" opacity="0.55"/>
    </>}
    <EdgeLabel p1={bc} p2={tc} text={`h=${h}`} color="#ea580c" dx={-26} dy={0}/>
    <EdgeLabel p1={tc} p2={rightT} text={`r=${r}`} color="#2563eb" dx={0} dy={-10}/>
  </svg>;
}

  {id:'slant',label:'גובה אלכסוני (l)',def:'המרחק מהקודקוד להיקף הבסיס; l = √(r²+h²).'},
];
function ConeSVG({r,h,activePart}){
  const n=40;
  const base3=circlePts3D(r,0,n);
  const allPts=[...base3,{x:0,y:0,z:0},{x:0,y:0,z:h}];
  const p3=makeProjector(allPts,260,230,26);
  const baseP=base3.map(p=>p3(p.x,p.y,p.z));
  const bc=p3(0,0,0), apex=p3(0,0,h);
  const {front,back}=ellipseArcs(baseP);
  const leftB = baseP.reduce((m,p)=>p.x<m.x?p:m, baseP[0]);
  const rightB = baseP.reduce((m,p)=>p.x>m.x?p:m, baseP[0]);
  const baseHi = activePart==='base' ? '#16a34a' : '#334155';
  const slantHi = activePart==='slant';
  return <svg viewBox="0 0 260 230" width="260" height="230">
    <path d={pathFrom(back)} fill="none" stroke={baseHi} strokeDasharray="4,3"/>
    <line x1={apex.x} y1={apex.y} x2={leftB.x} y2={leftB.y} stroke="#334155" strokeWidth="2.2"/>
    <line x1={apex.x} y1={apex.y} x2={rightB.x} y2={rightB.y} stroke={slantHi?'#dc2626':'#334155'} strokeWidth={slantHi?3:2.2}/>
    <path d={pathFrom(front)} fill="none" stroke={baseHi} strokeWidth="2.2"/>
    {activePart==='height' && <line x1={apex.x} y1={apex.y} x2={bc.x} y2={bc.y} stroke="#ea580c" strokeWidth="2.6" strokeDasharray="5,3"/>}
    {activePart==='radius' && <line x1={bc.x} y1={bc.y} x2={rightB.x} y2={rightB.y} stroke="#2563eb" strokeWidth="2.6" strokeDasharray="4,2"/>}
    {activePart!=='height' && <line x1={apex.x} y1={apex.y} x2={bc.x} y2={bc.y} stroke="#ea580c" strokeWidth="1.4" strokeDasharray="5,3" opacity="0.5"/>}
    {activePart!=='radius' && <line x1={bc.x} y1={bc.y} x2={rightB.x} y2={rightB.y} stroke="#2563eb" strokeWidth="1.4" strokeDasharray="4,2" opacity="0.5"/>}
    <EdgeLabel p1={apex} p2={bc} text={`h=${h}`} color="#ea580c" dx={-22} dy={0}/>
    <EdgeLabel p1={bc} p2={rightB} text={`r=${r}`} color="#2563eb" dx={10} dy={16}/>
    <EdgeLabel p1={apex} p2={rightB} text={`l`} color={slantHi?'#dc2626':'#64748b'} dx={16} dy={-6}/>
  </svg>;
}

  const radHi = activePart==='radius';
  return <svg viewBox={`0 0 ${W} ${Hh}`} width={W} height={Hh}>

    <EdgeLabel p1={{x:cx,y:cy}} p2={{x:cx+rad,y:cy}} text={`r=${r}`} color="#2563eb" dx={0} dy={-10}/>
  </svg>;
}

  {id:'cone',label:'החלק החרוטי',def:'החרוט העליון, על אותו בסיס — נפחו (1/3)πr²h, ומעטפתו πrl.'},
];
function CompositeSVG({r,h1,h2,activePart}){
  const n=40;
  const bottom3=circlePts3D(r,0,n), mid3=circlePts3D(r,h1,n);
  const allPts=[...bottom3,...mid3,{x:0,y:0,z:0},{x:0,y:0,z:h1+h2}];
  const p3=makeProjector(allPts,260,240,26);
  const bottomP=bottom3.map(p=>p3(p.x,p.y,p.z));
  const midP=mid3.map(p=>p3(p.x,p.y,p.z));
  const bc=p3(0,0,0), mc=p3(0,0,h1), apex=p3(0,0,h1+h2);
  const {front:bf,back:bb}=ellipseArcs(bottomP);
  const leftM = midP.reduce((m,p)=>p.x<m.x?p:m, midP[0]);
  const rightM = midP.reduce((m,p)=>p.x>m.x?p:m, midP[0]);
  const leftB = bottomP.reduce((m,p)=>p.x<m.x?p:m, bottomP[0]);
  const rightB = bottomP.reduce((m,p)=>p.x>m.x?p:m, bottomP[0]);
  const cylHi = activePart==='cyl' ? '#16a34a' : '#334155';
  const coneHi = activePart==='cone' ? '#16a34a' : '#334155';
  return <svg viewBox="0 0 260 240" width="260" height="240">
    <path d={pathFrom(bb)} fill="none" stroke={cylHi} strokeDasharray="4,3"/>
    <line x1={leftM.x} y1={leftM.y} x2={leftB.x} y2={leftB.y} stroke={cylHi} strokeWidth="2.2"/>
    <line x1={rightM.x} y1={rightM.y} x2={rightB.x} y2={rightB.y} stroke={cylHi} strokeWidth="2.2"/>
    <path d={pathFrom(bf)} fill="none" stroke={cylHi} strokeWidth="2.2"/>
    <path d={pathFrom(midP)+' Z'} fill="none" stroke={cylHi} strokeWidth="1.6" strokeDasharray="3,2" opacity="0.6"/>
    <line x1={apex.x} y1={apex.y} x2={leftM.x} y2={leftM.y} stroke={coneHi} strokeWidth="2.2"/>
    <line x1={apex.x} y1={apex.y} x2={rightM.x} y2={rightM.y} stroke={coneHi} strokeWidth="2.2"/>
    <EdgeLabel p1={bc} p2={mc} text={`h1=${h1}`} color="#ea580c" dx={-26} dy={0}/>
    <EdgeLabel p1={mc} p2={apex} text={`h2=${h2}`} color="#7c3aed" dx={26} dy={0}/>
    <EdgeLabel p1={bc} p2={rightB} text={`r=${r}`} color="#2563eb" dx={10} dy={16}/>
  </svg>;
}
function Ch7PartA(){
  const [data]=useState(()=>{ const [r,h2,l]=pickTriple(); return {r,h1:randInt(3,10),h2,l}; });
  const [active,setActive]=useState(null);
  const part = COMP_PARTS.find(p=>p.id===active);
  return <div className="step-card">
    <div className="svg-wrap"><CompositeSVG r={data.r} h1={data.h1} h2={data.h2} activePart={active}/></div>
    <div className="parts-row">
      {COMP_PARTS.map(p=><button key={p.id} className={`part-btn ${active===p.id?'active':''}`} onClick={()=>setActive(p.id)}>{p.label}</button>)}
    </div>
    <div className="def-box">{part ? part.def : 'לחצו על מרכיב כדי לראות הגדרה קצרה — גליל וחרוט המחוברים על אותו בסיס'}</div>
  </div>;
}
function Ch7PartB(){
  return <div>
    <div className="formula-box">V<sub>מורכב</sub> = V₁ + V₂<small>נפח גוף מורכב משני גופים המחוברים = סכום נפחיהם</small></div>
    <div className="formula-box">S<sub>מורכב</sub> = סכום השטחים החיצוניים בלבד<small>פני השטח המשותפים לשני הגופים (פנימיים) אינם נכללים בשטח הפנים הכולל</small></div>
    <div className="formula-box">V<sub>נותר</sub> = V<sub>חיצוני</sub> - V<sub>פנימי</sub><small>גוף חסום בתוך גוף אחר — הנפח הנותר הוא ההפרש</small></div>
    <div className="formula-box">יחס צלעות k &nbsp;⟹&nbsp; יחס שטחים k² &nbsp;⟹&nbsp; יחס נפחים k³<small>בגופים דומים, יחס הנפחים שווה לחזקה השלישית של יחס האורכים</small></div>
  </div>;
}
function Ch7Q1(){ // composite cylinder+cone
  const [data,setData]=useState(()=>{ const [r,h2,l]=pickTriple(); return {r,h1:randInt(3,10),h2,l}; });
  const [done,setDone]=useState(false);
  function reset(){ const [r,h2,l]=pickTriple(); setData({r,h1:randInt(3,10),h2,l}); setDone(false); }
  const {r,h1,h2,l}=data;
  const cylV=PI*r*r*h1, coneV=PI*r*r*h2/3, totalV=cylV+coneV;
  const cylLat=2*PI*r*h1, coneLat=PI*r*l, baseArea=PI*r*r, totalS=cylLat+coneLat+baseArea;
  return <div className="step-card">
    <div className="given-box">גליל וחרוט על אותו בסיס: r = {r}, גובה הגליל h₁ = {h1}, גובה החרוט h₂ = {h2} (גובה אלכסוני החרוט l = {l})</div>
    <div className="hint">מצאו את הנפח הכולל, ולאחר מכן את שטח הפנים החיצוני הכולל</div>
    {!done && <MultiStep doneMsg="✅ כל הכבוד!" steps={[
      {hint:'שלב 1: חשבו את נפח הגליל', render:(onOk)=><EquationResultInput requiredNums={[r,h1]} expected={cylV} tolerance={Math.max(0.5,cylV*0.01)} placeholder={`לדוגמה: π×${r}²×${h1}=...`} onCorrect={onOk}/>},
      {hint:'שלב 2: חשבו את נפח החרוט', render:(onOk)=><EquationResultInput requiredNums={[r,h2]} expected={coneV} tolerance={Math.max(0.5,coneV*0.01)} placeholder={`לדוגמה: (1/3)×π×${r}²×${h2}=...`} onCorrect={onOk}/>},
      {hint:'שלב 3: חשבו את הנפח הכולל', render:(onOk)=><EquationResultInput requiredNums={[]} expected={totalV} tolerance={Math.max(0.5,totalV*0.01)} placeholder="סכום שני הנפחים" onCorrect={onOk}/>},
      {hint:'שלב 4: חשבו את מעטפת הגליל (2πrh₁)', render:(onOk)=><EquationResultInput requiredNums={[r,h1]} expected={cylLat} tolerance={Math.max(0.5,cylLat*0.01)} placeholder={`לדוגמה: 2×π×${r}×${h1}=...`} onCorrect={onOk}/>},
      {hint:'שלב 5: חשבו את מעטפת החרוט (πrl)', render:(onOk)=><EquationResultInput requiredNums={[r,l]} expected={coneLat} tolerance={Math.max(0.5,coneLat*0.01)} placeholder={`לדוגמה: π×${r}×${l}=...`} onCorrect={onOk}/>},
      {hint:'שלב 6: הוסיפו את בסיס הגליל התחתון (πr²), וחשבו את שטח הפנים הכולל', render:(onOk)=><EquationResultInput requiredNums={[r]} expected={totalS} tolerance={Math.max(0.5,totalS*0.01)} placeholder={`לדוגמה: π×${r}²=... ואז הסכום`} onCorrect={()=>{onOk();setDone(true);}}/>},
    ]}/>}
    {done && <div className="banner">✅ כל הכבוד!<button className="btn bg" onClick={reset}>שאלה חדשה ↺</button></div>}
  </div>;
}
function Ch7Q2(){ // cone inscribed in cylinder — remaining volume
  const [data,setData]=useState(()=>{ const [r,h]=pickTriple(); return {r,h}; });
  const [done,setDone]=useState(false);
  function reset(){ const [r,h]=pickTriple(); setData({r,h}); setDone(false); }
  const {r,h}=data;
  const cylV=r*r*h, coneV=r*r*h/3, remCoeff=cylV-coneV;
  return <div className="step-card">
    <div className="given-box">בתוך גליל שרדיוסו r = {r} וגובהו h = {h} חרוט חרוט (קונוס) באותו בסיס ובאותו גובה</div>
    <div className="hint">מצאו את הנפח הנותר בגליל מחוץ לחרוט (בצורת מקדם × π)</div>
    {!done && <CoeffSuffixInput suffix="π" expectedCoeff={remCoeff} onCorrect={()=>setDone(true)}/>}
    {done && <div className="banner">✅ כל הכבוד!<button className="btn bg" onClick={reset}>שאלה חדשה ↺</button></div>}
  </div>;
}
function Ch7Q3(){ // pythagoras-first: box given l,w,d find h then volume
  const [data,setData]=useState(pickQuad);
  const [done,setDone]=useState(false);
  function reset(){ setData(pickQuad()); setDone(false); }
  const {l,w,h,d}=data;
  const sq=d*d-l*l-w*w;
  const V=l*w*h;
  return <div className="step-card">
    <div className="given-box">תיבה: l = {l}, w = {w}, אלכסון מרחבי d = {d}</div>
    <div className="hint">מצאו תחילה את הגובה החסר בעזרת פיתגורס, ולאחר מכן את נפח התיבה</div>
    {!done && <MultiStep doneMsg="✅ כל הכבוד!" steps={[
      {hint:'שלב 1: חשבו h² = d²-l²-w²', render:(onOk)=><EquationResultInput requiredNums={[d,l,w]} expected={sq} placeholder={`לדוגמה: ${d}²-${l}²-${w}²=...`} onCorrect={onOk}/>},
      {hint:'שלב 2: חשבו את הגובה h', render:(onOk)=><EquationResultInput requiredNums={[sq]} expected={h} placeholder={`לדוגמה: √${sq}=...`} onCorrect={onOk}/>},
      {hint:'שלב 3: חשבו את נפח התיבה', render:(onOk)=><EquationResultInput requiredNums={[l,w,h]} expected={V} placeholder={`לדוגמה: ${l}×${w}×${h}=...`} onCorrect={()=>{onOk();setDone(true);}}/>},
    ]}/>}
    {done && <div className="banner">✅ כל הכבוד!<button className="btn bg" onClick={reset}>שאלה חדשה ↺</button></div>}
  </div>;
}
function Ch7Q4(){ // similarity ratio -> volume ratio k^3
  const [data,setData]=useState(()=>({p:randInt(1,4),q:randInt(2,5)}));
  const [done,setDone]=useState(false);
  function reset(){ setData({p:randInt(1,4),q:randInt(2,5)}); setDone(false); }
  const {p,q}=data;
  return <div className="step-card">
    <div className="given-box">שני גופים דומים; היחס בין אורכי הצלעות המתאימות הוא {p} : {q}</div>
    <div className="hint">מצאו את היחס בין נפחי הגופים (חשבו כל אגף בנפרד)</div>
    {!done && <MultiStep doneMsg="✅ כל הכבוד!" steps={[
      {hint:`שלב 1: חשבו ${p}³`, render:(onOk)=><EquationResultInput requiredNums={[p]} expected={p**3} placeholder={`לדוגמה: ${p}×${p}×${p}=...`} onCorrect={onOk}/>},
      {hint:`שלב 2: חשבו ${q}³`, render:(onOk)=><EquationResultInput requiredNums={[q]} expected={q**3} placeholder={`לדוגמה: ${q}×${q}×${q}=...`} onCorrect={()=>{onOk();setDone(true);}}/>},
    ]}/>}
    {done && <div className="banner">✅ כל הכבוד! יחס הנפחים הוא {p**3} : {q**3}<button className="btn bg" onClick={reset}>שאלה חדשה ↺</button></div>}
  </div>;
}
function Ch7PartC(){
  const [sub,setSub]=useState('a');
  return <div>
    <div className="sub-tabs">
      <button className={`sub-tab ${sub==='a'?'active':''}`} onClick={()=>setSub('a')}>גוף מורכב</button>
      <button className={`sub-tab ${sub==='b'?'active':''}`} onClick={()=>setSub('b')}>גוף בתוך גוף</button>
      <button className={`sub-tab ${sub==='c'?'active':''}`} onClick={()=>setSub('c')}>פיתגורס תחילה</button>
      <button className={`sub-tab ${sub==='d'?'active':''}`} onClick={()=>setSub('d')}>יחס דמיון</button>
    </div>
    {sub==='a' && <Ch7Q1 key="a"/>}
    {sub==='b' && <Ch7Q2 key="b"/>}
    {sub==='c' && <Ch7Q3 key="c"/>}
    {sub==='d' && <Ch7Q4 key="d"/>}
  </div>;
}
function Chapter7(){
  const [tab,setTab]=useState('a');
  return <div className="content">
    <div className="card">
      <div className="card-t">שאלות משולבות</div>
      <div className="tabs">
        <button className={`tab ${tab==='a'?'active':''}`} onClick={()=>setTab('a')}>א. הצגה ויזואלית</button>
        <button className={`tab ${tab==='b'?'active':''}`} onClick={()=>setTab('b')}>ב. נוסחאות</button>
        <button className={`tab ${tab==='c'?'active':''}`} onClick={()=>setTab('c')}>ג. תרגול</button>
      </div>
      {tab==='a' && <Ch7PartA/>}
      {tab==='b' && <Ch7PartB/>}
      {tab==='c' && <Ch7PartC/>}
    </div>
  </div>;
}

/* ================= App (chapters 3-7 appended below) ================= */
const CHAPTERS=[
  {id:1,label:'1. קובייה',Comp:Chapter1},
  {id:2,label:'2. תיבה',Comp:Chapter2},
  {id:3,label:'3. גליל',Comp:Chapter3},
  {id:4,label:'4. קונוס',Comp:Chapter4},
  {id:5,label:'5. פירמידה',Comp:Chapter5},
  {id:6,label:'6. כדור',Comp:Chapter6},
  {id:7,label:'7. שאלות משולבות',Comp:Chapter7},
];
function App(){
  const [chapter,setChapter]=useState(1);
  const active=CHAPTERS.find(c=>c.id===chapter);
  return <div>
    <div className="hdr">
      <h1>גיאומטריה מרחבית — כיתה ט׳ מוגבר</h1>
      <div className="ch-nav">
        {CHAPTERS.map(c=><button key={c.id} className={`ch-btn ${chapter===c.id?'active':''}`} onClick={()=>setChapter(c.id)}>{c.label}</button>)}
      </div>
    </div>
    {active && <active.Comp/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
